<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Ticket - Rolf Thalmann´s Ticket Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 30px 40px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      background-color: #f97316;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .btn-back {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back:hover { background-color: #1f2937; }

    /* Form Layout */
    .form-container {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea, select {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #38bdf8;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .file-input-wrapper {
      background: rgba(0,0,0,0.2);
      border: 2px dashed var(--border-color);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }

    .file-input-wrapper:hover {
      border-color: #38bdf8;
    }

    .btn-submit {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
      transition: opacity 0.2s;
    }

    .btn-submit:hover { opacity: 0.9; }

    /* Modal / Detail View Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }

    .modal-img-container {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 6px;
    }

    .modal-body { padding: 25px; }

    .modal-tour {
      color: var(--accent-yellow);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .modal-grid-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .modal-grid-item strong {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .btn-confirm {
      background-color: #22c55e;
      color: #fff;
      border: none;
      padding: 12px;
      flex: 1;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-edit {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      flex: 1;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo">JJ</div>
      <div class="title-area">
        <h1>Add New Ticket Record</h1>
      </div>
    </div>
    <a href="index.html" class="btn-back">◄ Back to Archive</a>
  </header>

  <div class="form-container">
    <form id="addTicketForm" onsubmit="event.preventDefault(); showPreview();">
      <div class="form-grid">
        
        <div class="form-group">
          <label>Ticket ID (e.g. TICKET_0900)</label>
          <input type="text" id="ID_LISTKU" placeholder="Auto-generated if empty">
        </div>

        <div class="form-group">
          <label>Tour Name (TURNE)</label>
          <input type="text" id="TURNE" placeholder="e.g. BIG WORLD RECORDING">
        </div>

        <div class="form-group full-width">
          <label>Header / Info Text (INFO_TEXT)</label>
          <input type="text" id="INFO_TEXT" placeholder="e.g. 10th December 1986 – Ludwigshafen, Germany – Friedrich-Ebert-Halle" required>
        </div>

        <div class="form-group">
          <label>Date (DATUM)</label>
          <input type="text" id="DATUM" placeholder="YYYY-MM-DD or DD.MM.YYYY">
        </div>

        <div class="form-group">
          <label>City / Venue (MESTO)</label>
          <input type="text" id="MESTO" placeholder="e.g. Ludwigshafen, Germany">
        </div>

        <div class="form-group">
          <label>Price (CENA)</label>
          <input type="text" id="CENA" placeholder="e.g. 34,00">
        </div>

        <div class="form-group">
          <label>Currency (MENA)</label>
          <input type="text" id="MENA" placeholder="e.g. DM, EUR, USD">
        </div>

        <div class="form-group">
          <label>Seat / Row / Section (SEKTOR_RADA_SEDADLO)</label>
          <input type="text" id="SEKTOR_RADA_SEDADLO" placeholder="e.g. Reihe 14, Platz 31">
        </div>

        <div class="form-group">
          <label>Supporting Act (SUPPORTING_ACT)</label>
          <input type="text" id="SUPPORTING_ACT" placeholder="Leave empty if none">
        </div>

        <div class="form-group full-width">
          <label>Source / Contributor (ZDROJ_POSKYTNUL)</label>
          <input type="text" id="ZDROJ_POSKYTNUL" placeholder="e.g. Rolf Thalmann, Germany">
        </div>

        <div class="form-group full-width">
          <label>Scan File (SOUBOR_SKEN)</label>
          <div class="file-input-wrapper">
            <input type="file" id="scanFileInput" accept="image/*" onchange="handleFileSelect(event)">
            <input type="hidden" id="SOUBOR_SKEN">
          </div>
        </div>

        <div class="form-group full-width">
          <label>Setlist (Comma separated songs)</label>
          <textarea id="SETLIST" placeholder="Town Without Pity, On Your Radio, Real Men..." oninput="calculateSongs()"></textarea>
        </div>

        <div class="form-group">
          <label>Song Count (POCET_SKLADEB)</label>
          <input type="number" id="POCET_SKLADEB" readonly placeholder="Auto-calculated">
        </div>

        <div class="form-group">
          <label>Setlist.fm URL (SETLIST_URL)</label>
          <input type="url" id="SETLIST_URL" placeholder="https://www.setlist.fm/setlist/...">
        </div>

      </div>

      <button type="submit" class="btn-submit">Preview Ticket Card</button>
    </form>
  </div>

  <!-- Detail Preview Modal -->
  <div class="modal-overlay" id="previewModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closePreview()">✕</button>
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Ticket Scan Preview">
      </div>
      <div class="modal-body">
        <div class="modal-tour" id="modalTour"></div>
        <div class="modal-title" id="modalInfo"></div>
        
        <div class="modal-grid">
          <div class="modal-grid-item">
            <span>Source / Contributor</span>
            <strong id="modalSource">N/A</strong>
          </div>
          <div class="modal-grid-item">
            <span>Price</span>
            <strong id="modalPrice">N/A</strong>
          </div>
          <div class="modal-grid-item">
            <span>Seat / Row</span>
            <strong id="modalSeat">N/A</strong>
          </div>
          <div class="modal-grid-item" id="modalSupportItem">
            <span>Supporting Act</span>
            <strong id="modalSupport">N/A</strong>
          </div>
        </div>

        <div id="modalSetlistSection"></div>

        <div class="modal-actions">
          <button class="btn-edit" onclick="closePreview()">Edit Fields</button>
          <button class="btn-confirm" onclick="confirmAndSave()">Confirm & Save to CSV</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let existingCSVData = [];
    let uploadedFileBlob = null;
    let uploadedFileDataURL = "";

    window.addEventListener('DOMContentLoaded', () => {
      // Load current CSV to get record count & prepare master structure
      Papa.parse('joe_jackson_tickets_master_with_setlists.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          existingCSVData = results.data;
          // Auto fill next ID
          if (!document.getElementById('ID_LISTKU').value) {
            const nextNum = String(existingCSVData.length + 1).padStart(4, '0');
            document.getElementById('ID_LISTKU').value = `TICKET_${nextNum}`;
          }
        }
      });
    });

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file) {
        uploadedFileBlob = file;
        document.getElementById('SOUBOR_SKEN').value = file.name;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
          uploadedFileDataURL = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function calculateSongs() {
      const val = document.getElementById('SETLIST').value.trim();
      if (val) {
        const count = val.split(',').filter(s => s.trim().length > 0).length;
        document.getElementById('POCET_SKLADEB').value = count;
      } else {
        document.getElementById('POCET_SKLADEB').value = 0;
      }
    }

    function showPreview() {
      document.getElementById('modalImg').src = uploadedFileDataURL || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzMzMyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPk5vIFNjYW4gVXBsb2FkZWQ8L3RleHQ+PC9zdmc+';
      
      document.getElementById('modalTour').textContent = document.getElementById('TURNE').value || 'UNKNOWN TOUR';
      document.getElementById('modalInfo').textContent = document.getElementById('INFO_TEXT').value || 'No header text provided';
      document.getElementById('modalSource').textContent = document.getElementById('ZDROJ_POSKYTNUL').value || 'N/A';

      const cena = document.getElementById('CENA').value;
      const mena = document.getElementById('MENA').value;
      document.getElementById('modalPrice').textContent = cena ? `${cena} ${mena}` : 'N/A';

      document.getElementById('modalSeat').textContent = document.getElementById('SEKTOR_RADA_SEDADLO').value || 'N/A';

      const supportVal = document.getElementById('SUPPORTING_ACT').value.trim();
      const supportItem = document.getElementById('modalSupportItem');
      if (supportVal) {
        document.getElementById('modalSupport').textContent = supportVal;
        supportItem.style.display = 'block';
      } else {
        supportItem.style.display = 'none';
      }

      // Setlist
      const setlistStr = document.getElementById('SETLIST').value.trim();
      const songCount = document.getElementById('POCET_SKLADEB').value || 0;
      const setlistUrl = document.getElementById('SETLIST_URL').value.trim();
      const modalSetlistSec = document.getElementById('modalSetlistSection');

      if (setlistStr && songCount > 0) {
        const songs = setlistStr.split(',').map(s => s.trim());
        const listItems = songs.map(s => `<li>${s}</li>`).join('');
        const linkHtml = setlistUrl ? `<a href="${setlistUrl}" target="_blank" class="setlist-link" style="color:#38bdf8; display:inline-block; margin-top:8px;">View on Setlist.fm ↗</a>` : '';

        modalSetlistSec.innerHTML = `
          <h4 style="color: var(--accent-yellow); margin-bottom: 10px;">🎵 Full Setlist (${songCount} songs)</h4>
          <ol style="padding-left: 20px; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">${listItems}</ol>
          ${linkHtml}
        `;
      } else {
        modalSetlistSec.innerHTML = `<p style="color: var(--text-muted); font-style: italic;">No setlist provided.</p>`;
      }

      document.getElementById('previewModal').classList.add('active');
    }

    function closePreview() {
      document.getElementById('previewModal').classList.remove('active');
    }

    function confirmAndSave() {
      const newRecord = {
        ID_LISTKU: document.getElementById('ID_LISTKU').value,
        TURNE: document.getElementById('TURNE').value,
        INFO_TEXT: document.getElementById('INFO_TEXT').value,
        DATUM: document.getElementById('DATUM').value,
        MESTO: document.getElementById('MESTO').value,
        CENA: document.getElementById('CENA').value,
        MENA: document.getElementById('MENA').value,
        SEKTOR_RADA_SEDADLO: document.getElementById('SEKTOR_RADA_SEDADLO').value,
        SUPPORTING_ACT: document.getElementById('SUPPORTING_ACT').value,
        ZDROJ_POSKYTNUL: document.getElementById('ZDROJ_POSKYTNUL').value,
        SOUBOR_SKEN: document.getElementById('SOUBOR_SKEN').value,
        SETLIST: document.getElementById('SETLIST').value,
        POCET_SKLADEB: document.getElementById('POCET_SKLADEB').value,
        SETLIST_URL: document.getElementById('SETLIST_URL').value
      };

      existingCSVData.push(newRecord);

      // Convert back to CSV format
      const csvString = Papa.unparse(existingCSVData);

      // Trigger download of updated CSV file
      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'joe_jackson_tickets_master_with_setlists.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Download scan image if uploaded
      if (uploadedFileBlob) {
        const imgLink = document.createElement('a');
        imgLink.href = uploadedFileDataURL;
        imgLink.setAttribute('download', document.getElementById('SOUBOR_SKEN').value);
        document.body.appendChild(imgLink);
        imgLink.click();
        document.body.removeChild(imgLink);
      }

      alert('Updated CSV downloaded! Please replace your local CSV file (and place the scan in ./scans/) then push changes to GitHub.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
