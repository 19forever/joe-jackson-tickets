<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Record - Joe Jackson Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Viewer.js (Image Inspection & Zoom) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { font-size: 1.3rem; color: #fff; }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-token {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-token:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }

    .btn-back {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .btn-back:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

    /* Navigation Bar */
    .record-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 15px;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--accent-blue); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-add-new {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-add-new:hover { background-color: #fde047; }

    .record-counter { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    /* Main 2-Column Layout */
    .main-editor-layout {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .main-editor-layout { grid-template-columns: 1fr; }
    }

    /* Left Column: Image Preview Sticky Box */
    .scan-preview-sticky {
      position: sticky;
      top: 20px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }

    .scan-preview-sticky h3 {
      font-size: 0.8rem;
      color: var(--accent-yellow);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .img-box {
      background-color: #000;
      border-radius: 6px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 250px;
      max-height: 520px;
      overflow: hidden;
    }

    .img-box img {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
      cursor: zoom-in;
    }

    .thumb-list {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }

    .thumb-item {
      width: 50px;
      height: 38px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      opacity: 0.6;
    }

    .thumb-item:hover, .thumb-item.active { opacity: 1; border-color: var(--accent-yellow); }

    /* Right Column: Form Panels */
    .form-panel {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .form-panel h3 {
      font-size: 0.85rem;
      color: var(--accent-yellow);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .form-group.full-width { grid-column: 1 / -1; }

    label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

    input, select, textarea {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 0.85rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }

    textarea { resize: vertical; min-height: 60px; }

    .input-with-btn {
      display: flex;
      gap: 8px;
    }

    .input-with-btn input {
      flex-grow: 1;
    }

    .btn-fetch-setlist {
      background-color: #0284c7;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-fetch-setlist:hover {
      background-color: #0369a1;
    }

    .action-bar {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 15px;
    }

    .btn-submit {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-github {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.85rem;
    }

    #statusMessage {
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      display: none;
      font-size: 0.85rem;
      word-break: break-word;
    }

    .yt-preview { margin-top: 4px; font-size: 0.8rem; }
    .yt-preview a { color: var(--accent-blue); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>✏️ Edit Record: <span id="recordIdTitle">...</span></h1>
    <div class="header-actions">
      <button class="btn-token" onclick="manageToken()">🔑 PAT Settings</button>
      <a href="index.html" class="btn-back">◄ Back to Museum</a>
    </div>
  </header>

  <!-- Navigation & Action Bar -->
  <div class="record-nav-bar">
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="nav-btn" id="prevBtn" onclick="navigateRecord(-1)">◄ Previous</button>
      <button class="nav-btn" id="nextBtn" onclick="navigateRecord(1)">Next ►</button>
    </div>
    
    <div class="record-counter" id="recordCounter">Record 0 of 0</div>

    <button class="btn-add-new" onclick="addNewRecord()">➕ Add New Record</button>
  </div>

  <div class="main-editor-layout">
    
    <!-- Left Sticky Column: Image Inspection -->
    <div class="scan-preview-sticky">
      <h3>🔍 Scan Inspection (Click to Zoom)</h3>
      <div class="img-box">
        <img id="previewImg" src="" alt="Ticket Scan" title="Click to open full zoom viewer">
      </div>
      <div class="thumb-list" id="thumbList"></div>
    </div>

    <!-- Right Column: Compact Form -->
    <form id="editForm" onsubmit="event.preventDefault();">
      
      <!-- Primary Classification -->
      <div class="form-panel">
        <h3>Primary Metadata</h3>
        <div class="grid-3">
          <div class="form-group">
            <label for="ID_LISTKU">Record ID (ID_LISTKU)</label>
            <input type="text" id="ID_LISTKU" readonly style="opacity: 0.6; cursor: not-allowed;">
          </div>
          <div class="form-group">
            <label for="KATEGORIE">Category (KATEGORIE)</label>
            <select id="KATEGORIE">
              <option value="tickets">Tickets</option>
              <option value="passes">Passes</option>
              <option value="programs">Programs</option>
              <option value="posters">Posters</option>
              <option value="t-shirts">T-shirts</option>
              <option value="memorabilia">Memorabilia</option>
            </select>
          </div>
          <div class="form-group">
            <label for="TURNE">Tour / Era (TURNE)</label>
            <select id="TURNE" onchange="handleDropdownCustom('TURNE')">
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="DATUM">Concert Date (DATUM)</label>
            <input type="text" id="DATUM" placeholder="e.g. 1st October 2010">
          </div>
          <div class="form-group">
            <label for="MESTO">City & Venue (MESTO)</label>
            <input type="text" id="MESTO" placeholder="e.g. London, U.K. - Royal Albert Hall">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="INFO_TEXT">Info & Description (INFO_TEXT)</label>
          <textarea id="INFO_TEXT"></textarea>
        </div>
      </div>

      <!-- Scans & Contributor -->
      <div class="form-panel">
        <h3>Files & Contributor</h3>
        <div class="grid-2">
          <div class="form-group">
            <label for="SOUBOR_SKEN">Scan Image Filename(s) (SOUBOR_SKEN)</label>
            <input type="text" id="SOUBOR_SKEN" placeholder="file1.jpg, file2.webp" oninput="updateImageFromInput()">
          </div>
          <div class="form-group">
            <label for="CONTRIBUTOR_TEXT">Donor / Contributor (CONTRIBUTOR_TEXT)</label>
            <select id="CONTRIBUTOR_TEXT" onchange="handleDropdownCustom('CONTRIBUTOR_TEXT')">
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>
      </div>

      <!-- Seating, Price & Support Act -->
      <div class="form-panel">
        <h3>Ticket Details</h3>
        <div class="grid-4">
          <div class="form-group">
            <label for="CENA">Price (CENA)</label>
            <input type="text" id="CENA">
          </div>
          <div class="form-group">
            <label for="MENA">Currency (MENA)</label>
            <input type="text" id="MENA" placeholder="EUR, USD, GBP...">
          </div>
          <div class="form-group">
            <label for="SEKTOR_RADA_SEDADLO">Seat / Row / Section</label>
            <input type="text" id="SEKTOR_RADA_SEDADLO">
          </div>
          <div class="form-group">
            <label for="SUPPORTING_ACT">Supporting Act</label>
            <input type="text" id="SUPPORTING_ACT">
          </div>
        </div>
      </div>

      <!-- Setlist & Media -->
      <div class="form-panel">
        <h3>Setlist & Media Links</h3>
        <div class="grid-2">
          <div class="form-group">
            <label for="YOUTUBE_URL">🎬 YouTube Video URL (YOUTUBE_URL)</label>
            <input type="url" id="YOUTUBE_URL" placeholder="https://www.youtube.com/watch?v=..." oninput="updateYtPreview()">
            <div class="yt-preview" id="ytPreview"></div>
          </div>
          <div class="form-group">
            <label for="REVIEW_URL">📰 Press / Archive.org Embed URL (REVIEW_URL)</label>
            <input type="url" id="REVIEW_URL" placeholder="https://archive.org/embed/...">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label for="SETLIST_URL">Setlist.fm Link (SETLIST_URL)</label>
            <div class="input-with-btn">
              <input type="url" id="SETLIST_URL" placeholder="https://www.setlist.fm/setlist/...">
              <button type="button" class="btn-fetch-setlist" onclick="fetchSetlistFromApi()">🔍 Retrieve from Setlist.fm</button>
            </div>
          </div>
          <div class="form-group">
            <label for="POCET_SKLADEB">Song Count (POCET_SKLADEB)</label>
            <input type="number" id="POCET_SKLADEB" readonly style="opacity: 0.6; cursor: not-allowed;">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="SETLIST">Setlist Songs (Comma separated)</label>
          <textarea id="SETLIST" placeholder="Song 1, Song 2, Song 3..." oninput="recalculateSongCount()"></textarea>
        </div>
      </div>

      <div class="action-bar">
        <button class="btn-submit" onclick="downloadUpdatedCSV()">💾 Download Updated CSV</button>
        <button class="btn-github" onclick="commitToGitHub()">🚀 Save Directly to GitHub</button>
      </div>

      <div id="statusMessage"></div>
    </form>

  </div>

  <script>
    const CSV_FILENAME = 'joe_jackson_tickets_master_with_setlists.csv';
    const SETLIST_API_KEY_DEFAULT = '3pc6VtmOHzQbQVh9xedw_LLpNRCCfDhEvop7';

    let fullCsvData = [];
    let currentRecordIndex = -1;
    let viewerInstance = null;

    const fields = [
      'ID_LISTKU', 'TURNE', 'KATEGORIE', 'DATUM', 'MESTO', 'INFO_TEXT',
      'SOUBOR_SKEN', 'CONTRIBUTOR_TEXT', 'CENA', 'MENA',
      'SEKTOR_RADA_SEDADLO', 'SUPPORTING_ACT', 'YOUTUBE_URL', 'REVIEW_URL',
      'SETLIST_URL', 'SETLIST', 'POCET_SKLADEB'
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('id');

      Papa.parse(CSV_FILENAME, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          fullCsvData = results.data;
          
          populateDropdowns();

          if (targetId) {
            currentRecordIndex = fullCsvData.findIndex(r => r.ID_LISTKU === targetId);
          }

          if (currentRecordIndex === -1) {
            currentRecordIndex = 0;
          }

          loadRecord(currentRecordIndex);
        },
        error: function(err) {
          showStatus('Failed to load master CSV file.', 'red');
        }
      });
    });

    window.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement.tagName.toLowerCase();
      if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') {
        return;
      }

      if (e.key === 'ArrowLeft') {
        navigateRecord(-1);
      } else if (e.key === 'ArrowRight') {
        navigateRecord(1);
      }
    });

    function isValid(val) {
      if (!val) return false;
      const clean = String(val).trim().toLowerCase();
      return clean !== '' && clean !== 'není k dispozici' && clean !== 'n/a' && clean !== 'null';
    }

    function generateNextId() {
      let maxNum = 0;
      fullCsvData.forEach(r => {
        if (r.ID_LISTKU) {
          const match = r.ID_LISTKU.match(/\d+/);
          if (match) {
            const num = parseInt(match[0], 10);
            if (num > maxNum) maxNum = num;
          }
        }
      });
      const nextNum = maxNum + 1;
      return `TICKET_${String(nextNum).padStart(4, '0')}`;
    }

    function addNewRecord() {
      saveCurrentChangesToMemory();

      const newId = generateNextId();
      const newRecord = {
        ID_LISTKU: newId,
        KATEGORIE: 'tickets',
        TURNE: '',
        DATUM: '',
        MESTO: '',
        INFO_TEXT: '',
        SOUBOR_SKEN: '',
        CONTRIBUTOR_TEXT: '',
        CENA: '',
        MENA: '',
        SEKTOR_RADA_SEDADLO: '',
        SUPPORTING_ACT: '',
        YOUTUBE_URL: '',
        REVIEW_URL: '',
        SETLIST_URL: '',
        SETLIST: '',
        POCET_SKLADEB: '0'
      };

      fullCsvData.push(newRecord);
      currentRecordIndex = fullCsvData.length - 1;
      loadRecord(currentRecordIndex);
      showStatus(`Created new record with ID: ${newId}. Fill details and click Save to GitHub.`, 'blue');
    }

    function populateDropdowns() {
      const tourSelect = document.getElementById('TURNE');
      const uniqueTours = [...new Set(fullCsvData.map(r => r.TURNE).filter(isValid))].sort();
      
      tourSelect.innerHTML = '<option value="">-- Select Tour --</option>';
      uniqueTours.forEach(tour => {
        tourSelect.innerHTML += `<option value="${tour}">${tour}</option>`;
      });
      tourSelect.innerHTML += '<option value="__ADD_NEW__">➕ Add new Tour...</option>';

      const donorSelect = document.getElementById('CONTRIBUTOR_TEXT');
      const uniqueDonors = [...new Set(fullCsvData.map(r => r.CONTRIBUTOR_TEXT || r.ZDROJ_POSKYTNUL).filter(isValid))].sort();

      donorSelect.innerHTML = '<option value="">-- Select Contributor --</option>';
      uniqueDonors.forEach(donor => {
        donorSelect.innerHTML += `<option value="${donor}">${donor}</option>`;
      });
      donorSelect.innerHTML += '<option value="__ADD_NEW__">➕ Add new Contributor...</option>';
    }

    function handleDropdownCustom(fieldId) {
      const selectEl = document.getElementById(fieldId);
      if (selectEl.value === '__ADD_NEW__') {
        const newValue = prompt(`Enter name for new ${fieldId === 'TURNE' ? 'Tour' : 'Contributor'}:`);
        if (newValue && newValue.trim()) {
          const cleanVal = newValue.trim();
          const newOpt = document.createElement('option');
          newOpt.value = cleanVal;
          newOpt.textContent = cleanVal;
          selectEl.insertBefore(newOpt, selectEl.lastElementChild);
          selectEl.value = cleanVal;
        } else {
          selectEl.value = '';
        }
      }
    }

    function saveCurrentChangesToMemory() {
      if (currentRecordIndex >= 0 && currentRecordIndex < fullCsvData.length) {
        fullCsvData[currentRecordIndex] = getFormData();
      }
    }

    function loadRecord(index) {
      if (index < 0 || index >= fullCsvData.length) return;
      
      currentRecordIndex = index;
      const data = fullCsvData[currentRecordIndex];

      document.getElementById('recordIdTitle').textContent = data.ID_LISTKU || 'N/A';

      fields.forEach(field => {
        const el = document.getElementById(field);
        if (el) {
          if (field === 'CONTRIBUTOR_TEXT') {
            const val = data.CONTRIBUTOR_TEXT || data.ZDROJ_POSKYTNUL || '';
            setDropdownValue(el, val);
          } else if (field === 'TURNE') {
            setDropdownValue(el, data.TURNE || '');
          } else {
            el.value = data[field] || '';
          }
        }
      });

      renderImagePreview(data.SOUBOR_SKEN);
      updateYtPreview();
      recalculateSongCount();
      updateNavUI();

      const newUrl = `${window.location.pathname}?id=${encodeURIComponent(data.ID_LISTKU || '')}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
    }

    function setDropdownValue(selectEl, value) {
      if (!value) {
        selectEl.value = '';
        return;
      }
      let exists = Array.from(selectEl.options).some(opt => opt.value === value);
      if (!exists) {
        const newOpt = document.createElement('option');
        newOpt.value = value;
        newOpt.textContent = value;
        selectEl.insertBefore(newOpt, selectEl.lastElementChild);
      }
      selectEl.value = value;
    }

    function renderImagePreview(skenStr) {
      if (viewerInstance) {
        viewerInstance.destroy();
        viewerInstance = null;
      }

      const imgEl = document.getElementById('previewImg');
      const thumbListEl = document.getElementById('thumbList');
      thumbListEl.innerHTML = '';

      const files = (skenStr || '').split(',').map(s => s.trim()).filter(Boolean);

      if (files.length > 0) {
        imgEl.src = `./scans/${files[0]}`;
        imgEl.onerror = () => {
          imgEl.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzMzMyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4=';
        };

        if (files.length > 1) {
          files.forEach((f, idx) => {
            const thumb = document.createElement('img');
            thumb.className = `thumb-item ${idx === 0 ? 'active' : ''}`;
            thumb.src = `./scans/${f}`;
            thumb.onclick = () => {
              imgEl.src = `./scans/${f}`;
              document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');

              if (viewerInstance) {
                viewerInstance.destroy();
                viewerInstance = new Viewer(imgEl, { toolbar: true, navbar: false, title: false });
              }
            };
            thumbListEl.appendChild(thumb);
          });
        }

        setTimeout(() => {
          viewerInstance = new Viewer(imgEl, { toolbar: true, navbar: false, title: false });
        }, 100);

      } else {
        imgEl.src = '';
      }
    }

    function updateImageFromInput() {
      const val = document.getElementById('SOUBOR_SKEN').value;
      renderImagePreview(val);
    }

    function recalculateSongCount() {
      const text = document.getElementById('SETLIST').value;
      const countEl = document.getElementById('POCET_SKLADEB');
      if (text) {
        const songs = text.split(',').map(s => s.trim()).filter(Boolean);
        countEl.value = songs.length;
      } else {
        countEl.value = 0;
      }
    }

    /* Setlist.fm API Retrieval Logic */
    async function fetchSetlistFromApi() {
      const urlInput = document.getElementById('SETLIST_URL').value.trim();
      if (!urlInput) {
        showStatus('Please enter a valid Setlist.fm URL first.', 'red');
        return;
      }

      // Extract setlist ID from URL (e.g. -63dd6a2f.html -> 63dd6a2f)
      const match = urlInput.match(/-([a-z0-9]+)\.html/i) || urlInput.match(/\/setlist\/[^\/]+\/[^\/]+\/([a-z0-9]+)/i);
      if (!match) {
        showStatus('Could not extract Setlist ID from URL. Ensure it ends with e.g. -63dd6a2f.html', 'red');
        return;
      }

      const setlistId = match[1];
      const apiKey = SETLIST_API_KEY_DEFAULT;

      showStatus(`Fetching setlist ID '${setlistId}' from Setlist.fm...`, 'blue');

      const targetApiUrl = `https://api.setlist.fm/rest/1.0/setlist/${setlistId}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetApiUrl)}`;

      try {
        const res = await fetch(proxyUrl, {
          headers: {
            'x-api-key': apiKey,
            'Accept': 'application/json'
          }
        });

        if (!res.ok) {
          if (res.status === 404) throw new Error('Setlist ID not found on Setlist.fm.');
          if (res.status === 401 || res.status === 403) throw new Error('Invalid Setlist.fm API key or unauthorized request.');
          throw new Error(`API error HTTP ${res.status}`);
        }

        const data = await res.json();
        
        let songNames = [];
        if (data.sets && data.sets.set && Array.isArray(data.sets.set)) {
          data.sets.set.forEach(setObj => {
            if (setObj.song && Array.isArray(setObj.song)) {
              setObj.song.forEach(song => {
                if (song.name) songNames.push(song.name.trim());
              });
            }
          });
        }

        if (songNames.length === 0) {
          showStatus('Setlist found on Setlist.fm, but no songs are listed for this concert.', 'blue');
          return;
        }

        const formattedSetlist = songNames.join(', ');
        document.getElementById('SETLIST').value = formattedSetlist;
        recalculateSongCount();

        showStatus(`✅ Successfully retrieved ${songNames.length} songs from Setlist.fm!`, 'green');
      } catch (err) {
        showStatus(`❌ Setlist.fm fetch error: ${err.message}`, 'red');
      }
    }

    function navigateRecord(direction) {
      saveCurrentChangesToMemory();
      const newIndex = currentRecordIndex + direction;
      if (newIndex >= 0 && newIndex < fullCsvData.length) {
        loadRecord(newIndex);
      }
    }

    function updateNavUI() {
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const counter = document.getElementById('recordCounter');

      prevBtn.disabled = currentRecordIndex === 0;
      nextBtn.disabled = currentRecordIndex === fullCsvData.length - 1;
      counter.textContent = `Record ${currentRecordIndex + 1} of ${fullCsvData.length}`;
    }

    function updateYtPreview() {
      const val = document.getElementById('YOUTUBE_URL').value.trim();
      const prevEl = document.getElementById('ytPreview');
      if (val && val.startsWith('http')) {
        prevEl.innerHTML = `🔗 Test Link: <a href="${val}" target="_blank">${val} ↗</a>`;
      } else {
        prevEl.innerHTML = '';
      }
    }

    function getFormData() {
      const updated = { ...fullCsvData[currentRecordIndex] };

      fields.forEach(field => {
        const el = document.getElementById(field);
        if (el) {
          updated[field] = el.value.trim();
        }
      });

      if (updated.CONTRIBUTOR_TEXT) {
        updated.ZDROJ_POSKYTNUL = updated.CONTRIBUTOR_TEXT;
      }

      return updated;
    }

    function downloadUpdatedCSV() {
      if (currentRecordIndex === -1) return;

      saveCurrentChangesToMemory();
      const csvString = Papa.unparse(fullCsvData);

      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = CSV_FILENAME;
      link.click();

      showStatus('Updated CSV file downloaded! Replace it in your repository.', 'green');
    }

    function getStoredToken() {
      return localStorage.getItem('jj_github_pat') || '';
    }

    function manageToken() {
      const currentToken = getStoredToken();
      let msg = currentToken 
        ? 'A GitHub PAT is currently saved in your browser.\n\nEnter new token to replace it, or leave empty and click OK to clear it:'
        : 'Enter your GitHub Personal Access Token (PAT):';

      const newToken = prompt(msg, currentToken);
      if (newToken === null) return;

      if (newToken.trim() === '') {
        localStorage.removeItem('jj_github_pat');
        alert('Token removed from browser storage.');
      } else {
        localStorage.setItem('jj_github_pat', newToken.trim());
        alert('Token saved successfully in browser!');
      }
    }

    async function commitToGitHub() {
      let token = getStoredToken();

      if (!token) {
        token = prompt('Enter your GitHub Personal Access Token (PAT with repo scope):');
        if (!token) return;
        token = token.trim();

        if (confirm('Do you want to save this PAT in your browser for future edits?')) {
          localStorage.setItem('jj_github_pat', token);
        }
      }

      if (currentRecordIndex === -1) return;

      saveCurrentChangesToMemory();
      const csvString = Papa.unparse(fullCsvData);

      const repoOwner = '19forever';
      const repoName = 'joe-jackson-tickets';
      const filePath = CSV_FILENAME;

      showStatus('Connecting to GitHub API...', 'blue');

      try {
        const getFileRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          headers: { 
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getFileRes.ok) {
          const errData = await getFileRes.json().catch(() => ({}));
          if (getFileRes.status === 401) {
            localStorage.removeItem('jj_github_pat');
            throw new Error('Invalid PAT token or expired credentials (401).');
          } else if (getFileRes.status === 404) {
            throw new Error(`File '${filePath}' not found in repo ${repoOwner}/${repoName}. Check repository name or permissions.`);
          }
          throw new Error(errData.message || `GitHub API error: ${getFileRes.status}`);
        }

        const fileData = await getFileRes.json();
        const sha = fileData.sha;

        const contentEncoded = btoa(unescape(encodeURIComponent(csvString)));

        const updateRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `Update / Add record ${fullCsvData[currentRecordIndex].ID_LISTKU} via Web Editor`,
            content: contentEncoded,
            sha: sha
          })
        });

        if (updateRes.ok) {
          showStatus('✅ Successfully saved directly to GitHub! Changes will be live in ~30s.', 'green');
        } else {
          const errJson = await updateRes.json().catch(() => ({}));
          throw new Error(`GitHub Save Failed (${updateRes.status}): ${errJson.message || 'Check PAT scope permissions (needs repo scope)'}`);
        }
      } catch (err) {
        showStatus(`❌ ${err.message}`, 'red');
      }
    }

    function showStatus(msg, color) {
      const el = document.getElementById('statusMessage');
      el.style.display = 'block';
      el.textContent = msg;

      if (color === 'green') {
        el.style.background = 'rgba(34, 197, 94, 0.15)';
        el.style.border = '1px solid #22c55e';
        el.style.color = '#4ade80';
      } else if (color === 'red') {
        el.style.background = 'rgba(239, 68, 68, 0.15)';
        el.style.border = '1px solid #ef4444';
        el.style.color = '#f87171';
      } else {
        el.style.background = 'rgba(56, 189, 248, 0.15)';
        el.style.border = '1px solid #38bdf8';
        el.style.color = '#38bdf8';
      }
    }
  </script>
