<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Ticket Record - Joe Jackson Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 30px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { font-size: 1.5rem; color: #fff; }

    .btn-back {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .btn-back:hover { border-color: var(--accent-blue); color: var(--accent-blue); }

    .form-section {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .form-section h3 {
      font-size: 1rem;
      color: var(--accent-yellow);
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select, textarea {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
    }

    textarea { resize: vertical; min-height: 80px; }

    .action-bar {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn-submit {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-submit:hover { background-color: #fde047; }

    .btn-github {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-github:hover { background-color: #2ea043; }

    #statusMessage {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 0.9rem;
    }

    .yt-preview {
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .yt-preview a {
      color: var(--accent-blue);
      text-decoration: none;
    }

    .yt-preview a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>✏️ Edit Record: <span id="recordIdTitle">...</span></h1>
    <a href="index.html" class="btn-back">◄ Cancel & Back</a>
  </header>

  <form id="editForm" onsubmit="event.preventDefault();">
    
    <!-- Primary Details -->
    <div class="form-section">
      <h3>Basic Metadata</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="ID_LISTKU">ID (ID_LISTKU)</label>
          <input type="text" id="ID_LISTKU" readonly style="opacity: 0.6; cursor: not-allowed;">
        </div>
        <div class="form-group">
          <label for="TURNE">Tour / Era (TURNE)</label>
          <input type="text" id="TURNE">
        </div>
        <div class="form-group">
          <label for="KATEGORIE">Category (KATEGORIE)</label>
          <select id="KATEGORIE">
            <option value="Tickets">Tickets</option>
            <option value="Passes">Passes</option>
            <option value="Programs">Programs</option>
            <option value="Posters">Posters</option>
            <option value="T-shirts">T-shirts</option>
            <option value="Memorabilia">Memorabilia</option>
          </select>
        </div>
        <div class="form-group">
          <label for="DATUM">Date (DATUM)</label>
          <input type="text" id="DATUM" placeholder="e.g. 1st October 2010 or 2010-10-01">
        </div>
        <div class="form-group full-width">
          <label for="INFO_TEXT">Info / Description (INFO_TEXT)</label>
          <textarea id="INFO_TEXT"></textarea>
        </div>
      </div>
    </div>

    <!-- Scans & Venue Details -->
    <div class="form-section">
      <h3>Files, Source & Details</h3>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="SOUBOR_SKEN">Scan File(s) (SOUBOR_SKEN)</label>
          <input type="text" id="SOUBOR_SKEN" placeholder="kk-file1.jpg, kk-file2.webp">
        </div>
        <div class="form-group">
          <label for="ZDROJ_POSKYTNUL">Source / Contributor (ZDROJ_POSKYTNUL)</label>
          <input type="text" id="ZDROJ_POSKYTNUL">
        </div>
        <div class="form-group">
          <label for="MESTO">City / Venue (MESTO)</label>
          <input type="text" id="MESTO">
        </div>
        <div class="form-group">
          <label for="CENA">Price (CENA)</label>
          <input type="text" id="CENA">
        </div>
        <div class="form-group">
          <label for="MENA">Currency (MENA)</label>
          <input type="text" id="MENA" placeholder="EUR, USD, GBP, CHF...">
        </div>
        <div class="form-group">
          <label for="SEKTOR_RADA_SEDADLO">Seat / Row / Section</label>
          <input type="text" id="SEKTOR_RADA_SEDADLO">
        </div>
        <div class="form-group">
          <label for="SUPPORTING_ACT">Supporting Act</label>
          <input type="text" id="SUPPORTING_ACT">
        </div>
      </div>
    </div>

    <!-- Media, Videos & Setlist -->
    <div class="form-section">
      <h3>Setlist & Media Links</h3>
      <div class="form-grid">
        <div class="form-group full-width">
          <label for="YOUTUBE_URL">🎬 YouTube Concert Video URL (YOUTUBE_URL)</label>
          <input type="url" id="YOUTUBE_URL" placeholder="https://www.youtube.com/watch?v=..." oninput="updateYtPreview()">
          <div class="yt-preview" id="ytPreview"></div>
        </div>
        <div class="form-group full-width">
          <label for="SETLIST_URL">Setlist.fm Link (SETLIST_URL)</label>
          <input type="url" id="SETLIST_URL" placeholder="https://www.setlist.fm/setlist/...">
        </div>
        <div class="form-group full-width">
          <label for="SETLIST">Setlist Songs (Comma separated)</label>
          <textarea id="SETLIST" placeholder="Song 1, Song 2, Song 3..."></textarea>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn-submit" onclick="downloadUpdatedCSV()">💾 Download Updated CSV</button>
      <button class="btn-github" onclick="commitToGitHub()">🚀 Save Directly to GitHub</button>
    </div>

    <div id="statusMessage"></div>
  </form>

  <script>
    const CSV_FILENAME = 'joe_jackson_tickets_master_with_setlists.csv';
    let fullCsvData = [];
    let currentRecordIndex = -1;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const targetId = urlParams.get('id');

      if (!targetId) {
        showStatus('No record ID specified in URL.', 'red');
        return;
      }

      Papa.parse(CSV_FILENAME, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          fullCsvData = results.data;
          currentRecordIndex = fullCsvData.findIndex(r => r.ID_LISTKU === targetId);

          if (currentRecordIndex === -1) {
            showStatus(`Record ID '${targetId}' not found in CSV!`, 'red');
            return;
          }

          populateForm(fullCsvData[currentRecordIndex]);
        },
        error: function(err) {
          showStatus('Failed to load master CSV file.', 'red');
        }
      });
    });

    function populateForm(data) {
      document.getElementById('recordIdTitle').textContent = data.ID_LISTKU || 'N/A';

      const fields = [
        'ID_LISTKU', 'TURNE', 'KATEGORIE', 'DATUM', 'INFO_TEXT',
        'SOUBOR_SKEN', 'ZDROJ_POSKYTNUL', 'MESTO', 'CENA', 'MENA',
        'SEKTOR_RADA_SEDADLO', 'SUPPORTING_ACT', 'YOUTUBE_URL',
        'SETLIST_URL', 'SETLIST'
      ];

      fields.forEach(field => {
        const el = document.getElementById(field);
        if (el) {
          el.value = data[field] || '';
        }
      });

      updateYtPreview();
    }

    function updateYtPreview() {
      const val = document.getElementById('YOUTUBE_URL').value.trim();
      const prevEl = document.getElementById('ytPreview');
      if (val && val.startsWith('http')) {
        prevEl.innerHTML = `🔗 Test Link: <a href="${val}" target="_blank">${val} ↗</a>`;
      } else {
        prevEl.innerHTML = '';
      }
    }

    function getFormData() {
      const updated = { ...fullCsvData[currentRecordIndex] };

      const fields = [
        'ID_LISTKU', 'TURNE', 'KATEGORIE', 'DATUM', 'INFO_TEXT',
        'SOUBOR_SKEN', 'ZDROJ_POSKYTNUL', 'MESTO', 'CENA', 'MENA',
        'SEKTOR_RADA_SEDADLO', 'SUPPORTING_ACT', 'YOUTUBE_URL',
        'SETLIST_URL', 'SETLIST'
      ];

      fields.forEach(field => {
        const el = document.getElementById(field);
        if (el) {
          updated[field] = el.value.trim();
        }
      });

      // Recalculate song count
      if (updated.SETLIST) {
        const songs = updated.SETLIST.split(',').map(s => s.trim()).filter(Boolean);
        updated.POCET_SKLADEB = songs.length;
      } else {
        updated.POCET_SKLADEB = 0;
      }

      return updated;
    }

    function downloadUpdatedCSV() {
      if (currentRecordIndex === -1) return;

      fullCsvData[currentRecordIndex] = getFormData();
      const csvString = Papa.unparse(fullCsvData);

      const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = CSV_FILENAME;
      link.click();

      showStatus('Updated CSV file downloaded! Replace it in your repository.', 'green');
    }

    async function commitToGitHub() {
      const token = prompt('Enter your GitHub Personal Access Token (PAT):');
      if (!token) return;

      if (currentRecordIndex === -1) return;

      fullCsvData[currentRecordIndex] = getFormData();
      const csvString = Papa.unparse(fullCsvData);

      const repoOwner = '19forever';
      const repoName = 'joe-jackson-tickets';
      const filePath = CSV_FILENAME;

      showStatus('Committing changes to GitHub...', 'blue');

      try {
        // 1. Get file SHA
        const getFileRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (!getFileRes.ok) throw new Error('Failed to fetch existing file details from GitHub.');

        const fileData = await getFileRes.json();
        const sha = fileData.sha;

        // 2. Commit update
        const contentEncoded = btoa(unescape(encodeURIComponent(csvString)));

        const updateRes = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${filePath}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Update record ${fullCsvData[currentRecordIndex].ID_LISTKU} via Web Editor`,
            content: contentEncoded,
            sha: sha
          })
        });

        if (updateRes.ok) {
          showStatus('Successfully committed to GitHub! Changes will be live in ~30s.', 'green');
        } else {
          const errJson = await updateRes.json();
          throw new Error(errJson.message || 'Failed to update file on GitHub.');
        }
      } catch (err) {
        showStatus(`Error: ${err.message}`, 'red');
      }
    }

    function showStatus(msg, color) {
      const el = document.getElementById('statusMessage');
      el.style.display = 'block';
      el.textContent = msg;

      if (color === 'green') {
        el.style.background = 'rgba(34, 197, 94, 0.15)';
        el.style.border = '1px solid #22c55e';
        el.style.color = '#4ade80';
      } else if (color === 'red') {
        el.style.background = 'rgba(239, 68, 68, 0.15)';
        el.style.border = '1px solid #ef4444';
        el.style.color = '#f87171';
      } else {
        el.style.background = 'rgba(56, 189, 248, 0.15)';
        el.style.border = '1px solid #38bdf8';
        el.style.color = '#38bdf8';
      }
    }
  </script>
</body>
</html>
