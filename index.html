<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolf Thalmann´s Ticket Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Viewer.js (Image Zoom & Inspection) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 0 40px 40px 40px;
      min-height: 100vh;
    }

    .viewer-container { z-index: 99999 !important; }

    .top-header-container {
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      z-index: 100;
      padding-top: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-left { display: flex; align-items: center; gap: 15px; }

    .logo {
      background-color: #f97316;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .year-badge {
      background-color: transparent;
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .title-area p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .stats-bar span { color: var(--border-color); }
    .stat-val-yellow { color: var(--accent-yellow); }
    .stat-val-white { color: #fff; }

    /* Banner "On This Day in History" */
    .on-this-day-banner {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.15), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 15px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .on-this-day-banner.active { display: flex; }

    .otd-left { display: flex; align-items: center; gap: 12px; }

    .otd-icon {
      font-size: 1.3rem;
      background: rgba(250, 204, 21, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .otd-text h4 {
      font-size: 0.85rem;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .otd-text p {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .otd-btn {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .otd-btn:hover { background-color: #fde047; }

    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { border-color: #38bdf8; color: #fff; }
    .tab-btn.active { background-color: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1fr 110px auto;
      gap: 10px;
      background-color: var(--bg-panel);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    @media (max-width: 1200px) {
      .controls { grid-template-columns: 1fr 1fr 1fr; }
    }

    .controls input, .controls select {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls input:focus, .controls select:focus { border-color: var(--accent-blue); }

    .layout-toggles { display: flex; gap: 5px; }

    .toggle-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 100%;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .toggle-btn.active { background-color: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

    .tickets-container.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .tickets-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tickets-container.list-view .ticket-card { flex-direction: row; align-items: center; height: auto; }
    .tickets-container.list-view .card-img-wrapper { width: 180px; height: 120px; flex-shrink: 0; }

    .ticket-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .ticket-card:hover { border-color: #38bdf8; transform: translateY(-2px); }

    .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .edit-icon-btn {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .edit-icon-btn:hover { color: var(--accent-yellow); border-color: var(--accent-yellow); }

    .card-img-wrapper {
      position: relative;
      height: 160px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }

    .tour-name { color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    .card-date { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .info-text { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); line-height: 1.4; margin-bottom: 8px; flex-grow: 1; }

    /* Supporting Act Tag on Card */
    .card-support-tag {
      font-size: 0.75rem;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Related Item Badge Buttons */
    .related-items-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 6px;
    }

    .related-btn {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .related-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
      border-color: #38bdf8;
    }

    .meta-details-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 8px;
      margin-top: 6px;
    }

    .source-val { color: var(--text-main); font-weight: 600; text-align: right; }

    .setlist-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .setlist-toggle-btn.has-setlist {
      background: rgba(250, 204, 21, 0.12);
      border-color: rgba(250, 204, 21, 0.5);
      color: var(--accent-yellow);
      font-weight: 700;
    }

    .setlist-toggle-btn.has-setlist:hover {
      background: rgba(250, 204, 21, 0.25);
    }

    .setlist-content {
      display: none;
      margin-top: 10px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .setlist-content.open { display: block; }
    .setlist-content ol { padding-left: 20px; margin: 10px 0; }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .page-btn {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
      font-weight: 700;
    }

    /* Modal / Detail View Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border-color);
    }

    .modal-nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-nav-btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--accent-blue); }
    .modal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none; color: #fff;
      font-size: 1.2rem; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-close:hover { background: rgba(239, 68, 68, 0.8); }

    .modal-img-container {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 48vh;
      object-fit: contain;
      border-radius: 6px;
      cursor: zoom-in;
    }

    .modal-thumbnails {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .modal-thumb {
      width: 50px;
      height: 38px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      opacity: 0.6;
    }

    .modal-thumb:hover, .modal-thumb.active { opacity: 1; border-color: var(--accent-yellow); }

    .modal-body { padding: 25px; }
    .modal-tour { color: var(--accent-yellow); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .modal-date { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .modal-title { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-bottom: 20px; }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .modal-grid-item span { display: block; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 2px; }
    .modal-grid-item strong { font-size: 0.9rem; color: var(--text-main); }

    .media-embed-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .media-embed-box h4 {
      font-size: 0.85rem;
      color: var(--accent-blue);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .media-links-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .media-link-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .media-link-btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
  </style>
</head>
<body>

  <div class="top-header-container">
    <header>
      <div class="header-left">
        <div class="logo">JJ</div>
        <div class="title-area">
          <h1>Rolf Thalmann´s Ticket Museum <span class="year-badge" id="yearBadge">...</span></h1>
          <p>Historical archive of Joe Jackson´s concert tickets, venues & memorabilia</p>
        </div>
      </div>
    </header>

    <div class="stats-bar">
      <div>LOADED RECORDS: <strong class="stat-val-yellow" id="stat-tickets">0</strong></div> <span>|</span>
      <div>TOURS REPRESENTED: <strong class="stat-val-white" id="stat-tours">0</strong></div> <span>|</span>
      <div>CONTRIBUTORS / DONORS: <strong class="stat-val-white" id="stat-donors">0</strong></div>
    </div>

    <!-- On This Day in History Banner -->
    <div class="on-this-day-banner" id="otdBanner">
      <div class="otd-left">
        <div class="otd-icon">📅</div>
        <div class="otd-text">
          <h4>On This Day In History</h4>
          <p id="otdTitle">...</p>
        </div>
      </div>
      <button class="otd-btn" id="otdBtn">🎫 View Anniversary Show</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Search by city, venue, donor, date, tour..." onkeyup="filterData()">
      <select id="tourFilter" onchange="filterData()"><option value="">All Tours & Eras</option></select>
      <select id="venueFilter" onchange="filterData()"><option value="">All Venues / Cities</option></select>
      <select id="donorFilter" onchange="filterData()"><option value="">All Donors / Sources</option></select>
      <select id="sortFilter" onchange="filterData()">
        <option value="oldest">Date (Oldest First)</option>
        <option value="newest">Date (Newest First)</option>
      </select>
      <select id="pageSizeFilter" onchange="changePageSize()">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="ALL">ALL</option>
      </select>
      <div class="layout-toggles">
        <button class="toggle-btn active" id="btnGrid" onclick="setLayout('grid')">⊞</button>
        <button class="toggle-btn" id="btnList" onclick="setLayout('list')">≡</button>
      </div>
    </div>
  </div>

  <div id="ticketsContainer" class="tickets-container grid-view"></div>
  <div id="paginationContainer" class="pagination-container"></div>

  <!-- Detail Modal Window -->
  <div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <div class="modal-nav-bar">
        <button class="modal-nav-btn" id="modalPrevBtn" onclick="navigateModal(-1)">◄ Previous</button>
        <div class="modal-counter" id="modalCounter">0 / 0</div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <button class="modal-nav-btn" id="modalNextBtn" onclick="navigateModal(1)">Next ►</button>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
      </div>

      <div class="modal-img-container">
        <div id="modalViewerWrapper">
          <img id="modalImg" src="" alt="Ticket Full View">
        </div>
        <div class="modal-thumbnails" id="modalThumbnails"></div>
      </div>

      <div class="modal-body">
        <div class="modal-tour" id="modalTour"></div>
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-title" id="modalInfo"></div>
        
        <div class="modal-grid" id="modalGrid">
          <div class="modal-grid-item" id="modalSourceGroup">
            <span>Source / Contributor</span>
            <strong id="modalSource"></strong>
          </div>
          <div class="modal-grid-item" id="modalSupportGroup">
            <span>Supporting Act</span>
            <strong id="modalSupport"></strong>
          </div>
          <div class="modal-grid-item" id="modalPriceGroup">
            <span>Original Price</span>
            <strong id="modalPrice"></strong>
          </div>
          <div class="modal-grid-item" id="modalSeatGroup">
            <span>Seating / Section</span>
            <strong id="modalSeat"></strong>
          </div>
        </div>

        <!-- External Media Links & Embeds -->
        <div id="modalMediaContainer"></div>

        <!-- Full Setlist Section -->
        <div id="modalSetlistSection" style="margin-top: 20px;"></div>
      </div>
    </div>
  </div>

  <!-- Skrytý prvek pro spuštění Lupy (Viewer.js) nad souvisejícími obrázky -->
  <img id="quickViewerImg" src="" style="display: none;" alt="Quick Viewer">

  <script>
    let allTickets = [];
    let filteredTickets = [];
    let currentLayout = 'grid';
    let currentPage = 1;
    let pageSize = 50;
    let currentCategory = 'Tickets';
    let currentModalIndex = -1;

    let imageViewerInstance = null;
    let quickViewerInstance = null;

    function isValidValue(val) {
      if (!val) return false;
      const clean = String(val).trim().toLowerCase();
      return clean !== '' && clean !== 'není k dispozici' && clean !== 'n/a' && clean !== 'undefined' && clean !== 'null';
    }

    function getTicketCategory(t) {
      if (t.KATEGORIE && t.KATEGORIE.trim()) {
        const cat = t.KATEGORIE.trim().toLowerCase();
        if (cat.includes('pass')) return 'Passes';
        if (cat.includes('program')) return 'Programs';
        if (cat.includes('poster')) return 'Posters';
        if (cat.includes('shirt') || cat.includes('t-shirt') || cat.includes('tričko')) return 'T-shirts';
        if (cat.includes('memo')) return 'Memorabilia';
        if (cat.includes('ticket')) return 'Tickets';
      }
      return 'Tickets';
    }

    function parseInfoText(t) {
      let rawText = (t.INFO_TEXT || '').trim();
      let explicitDate = (t.DATUM || '').trim();
      const dateRegex = /\b(\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]+\s+\d{4}|\d{4}-\d{2}-\d{2}|\d{1,2}\.\d{1,2}\.\d{4})\b/i;
      const match = rawText.match(dateRegex);

      let extractedDate = explicitDate;
      let cleanedText = rawText;

      if (match) {
        if (!extractedDate) extractedDate = match[0];
        cleanedText = rawText.replace(match[0], '').replace(/^[\s–—\-]+|[\s–—\-]+$/g, '').trim();
      }

      return { date: extractedDate, text: cleanedText || rawText };
    }

    function parseToDate(t) {
      const parsed = parseInfoText(t);
      if (!parsed.date) return new Date(0);
      let cleanDateStr = parsed.date.replace(/(\d+)(st|nd|rd|th)/i, '$1').replace(/\./g, '/');
      let timestamp = Date.parse(cleanDateStr);
      return isNaN(timestamp) ? new Date(0) : new Date(timestamp);
    }

    function getRelatedItems(currentRecord) {
      const currentInfo = (currentRecord.INFO_TEXT || '').trim().toLowerCase();
      if (!currentInfo) return [];

      return allTickets.filter(item => {
        if (item.ID_LISTKU === currentRecord.ID_LISTKU) return false;
        const itemInfo = (item.INFO_TEXT || '').trim().toLowerCase();
        return itemInfo === currentInfo;
      });
    }

    /* Funkce pro dohledání dnešního výročí ("On This Day in History") */
    function checkOnThisDayAnniversary() {
      const today = new Date();
      const currentDay = today.getDate();
      const currentMonth = today.getMonth();

      const anniversaries = allTickets.filter(t => {
        const d = parseToDate(t);
        return d.getTime() > 0 && d.getDate() === currentDay && d.getMonth() === currentMonth;
      });

      if (anniversaries.length > 0) {
        const selected = anniversaries[0];
        const parsed = parseInfoText(selected);
        const concertDate = parseToDate(selected);
        const yearsAgo = today.getFullYear() - concertDate.getFullYear();

        const banner = document.getElementById('otdBanner');
        const titleEl = document.getElementById('otdTitle');
        const btn = document.getElementById('otdBtn');

        let text = `<strong>${yearsAgo} years ago</strong> (${concertDate.getFullYear()}): Joe Jackson played in ${parsed.text}`;
        if (anniversaries.length > 1) {
          text += ` <em>(+${anniversaries.length - 1} more show today)</em>`;
        }

        titleEl.innerHTML = text;
        banner.classList.add('active');

        btn.onclick = () => {
          const targetIndex = filteredTickets.indexOf(selected);
          if (targetIndex !== -1) {
            openModal(targetIndex);
          } else {
            document.getElementById('searchInput').value = '';
            document.getElementById('tourFilter').value = '';
            document.getElementById('venueFilter').value = '';
            document.getElementById('donorFilter').value = '';
            currentCategory = 'ALL';
            filterData();
            setTimeout(() => {
              openModal(filteredTickets.indexOf(selected));
            }, 100);
          }
        };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse('joe_jackson_tickets_master_with_setlists.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allTickets = results.data;
          updateStats();
          populateFilters();
          filterData();
          checkOnThisDayAnniversary();
        }
      });
    });

    function updateStats() {
      document.getElementById('stat-tickets').textContent = allTickets.length;
      const uniqueTours = new Set(allTickets.map(t => t.TURNE).filter(isValidValue));
      document.getElementById('stat-tours').textContent = uniqueTours.size;
      const uniqueDonors = new Set(allTickets.map(t => t.CONTRIBUTOR_TEXT || t.ZDROJ_POSKYTNUL).filter(isValidValue));
      document.getElementById('stat-donors').textContent = uniqueDonors.size;

      const years = allTickets
        .map(t => parseToDate(t).getFullYear())
        .filter(y => y > 1900);
      if (years.length > 0) {
        const minYear = Math.min(...years);
        const maxYear = Math.max(...years);
        document.getElementById('yearBadge').textContent = `${minYear} – ${maxYear}`;
      }
    }

    function populateFilters() {
      // Tours Filter
      const tourSelect = document.getElementById('tourFilter');
      const tours = [...new Set(allTickets.map(t => t.TURNE).filter(isValidValue))].sort();
      tours.forEach(tour => {
        const opt = document.createElement('option');
        opt.value = tour; opt.textContent = tour;
        tourSelect.appendChild(opt);
      });

      // Venues / Cities Filter
      const venueSelect = document.getElementById('venueFilter');
      const venues = [...new Set(allTickets.map(t => t.MESTO).filter(isValidValue))].sort();
      venues.forEach(venue => {
        const opt = document.createElement('option');
        opt.value = venue; opt.textContent = venue;
        venueSelect.appendChild(opt);
      });

      // Donors Filter
      const donorSelect = document.getElementById('donorFilter');
      const donors = [...new Set(allTickets.map(t => t.CONTRIBUTOR_TEXT || t.ZDROJ_POSKYTNUL).filter(isValidValue))].sort();
      donors.forEach(donor => {
        const opt = document.createElement('option');
        opt.value = donor; opt.textContent = donor;
        donorSelect.appendChild(opt);
      });
    }

    function renderCategoryTabs(matchesBeforeCategoryFilter) {
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      const counts = { 'Tickets': 0, 'Passes': 0, 'Programs': 0, 'Posters': 0, 'T-shirts': 0, 'Memorabilia': 0, 'ALL': matchesBeforeCategoryFilter.length };

      matchesBeforeCategoryFilter.forEach(t => {
        const cat = getTicketCategory(t);
        if (counts[cat] !== undefined) counts[cat]++;
      });

      const categoryOrder = ['Tickets', 'Passes', 'Programs', 'Posters', 'T-shirts', 'Memorabilia', 'ALL'];
      const categoryLabels = { 'Tickets': '🎫 Tickets', 'Passes': '🪪 Passes', 'Programs': '📖 Programs', 'Posters': '🖼️ Posters', 'T-shirts': '🎽 T-shirts', 'Memorabilia': '⭐ Memorabilia', 'ALL': '✨ All Records' };

      categoryOrder.forEach(catKey => {
        const count = counts[catKey];
        if (count > 0 || catKey === 'ALL' || catKey === 'Tickets') {
          const btn = document.createElement('button');
          btn.className = `tab-btn ${currentCategory === catKey ? 'active' : ''}`;
          btn.innerHTML = `${categoryLabels[catKey]} <span style="opacity: 0.75; font-size: 0.8em;">(${count})</span>`;
          btn.onclick = () => { currentCategory = catKey; filterData(); };
          tabsContainer.appendChild(btn);
        }
      });
    }

    function setLayout(layout) {
      currentLayout = layout;
      document.getElementById('btnGrid').className = `toggle-btn ${layout === 'grid' ? 'active' : ''}`;
      document.getElementById('btnList').className = `toggle-btn ${layout === 'list' ? 'active' : ''}`;
      document.getElementById('ticketsContainer').className = `tickets-container ${layout}-view`;
      renderPaginated();
    }

    function changePageSize() {
      const val = document.getElementById('pageSizeFilter').value;
      pageSize = val === 'ALL' ? 'ALL' : parseInt(val);
      currentPage = 1;
      renderPaginated();
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const tour = document.getElementById('tourFilter').value;
      const venue = document.getElementById('venueFilter').value;
      const donor = document.getElementById('donorFilter').value;
      const sort = document.getElementById('sortFilter').value;

      const matchesBase = allTickets.filter(t => {
        const donorVal = t.CONTRIBUTOR_TEXT || t.ZDROJ_POSKYTNUL || '';
        const qMatch = !query || 
          (t.INFO_TEXT || '').toLowerCase().includes(query) ||
          donorVal.toLowerCase().includes(query) ||
          (t.MESTO || '').toLowerCase().includes(query) ||
          (t.SUPPORTING_ACT || '').toLowerCase().includes(query) ||
          (t.SETLIST || '').toLowerCase().includes(query);
          
        const tMatch = !tour || t.TURNE === tour;
        const vMatch = !venue || t.MESTO === venue;
        const dMatch = !donor || donorVal === donor;
        return qMatch && tMatch && vMatch && dMatch;
      });

      renderCategoryTabs(matchesBase);

      filteredTickets = matchesBase.filter(t => {
        if (currentCategory === 'ALL') return true;
        return getTicketCategory(t).toLowerCase() === currentCategory.toLowerCase();
      });

      filteredTickets.sort((a, b) => {
        const dateA = parseToDate(a);
        const dateB = parseToDate(b);
        return sort === 'newest' ? dateB - dateA : dateA - dateB;
      });

      currentPage = 1;
      renderPaginated();
    }

    function renderPaginated() {
      let pageData = pageSize === 'ALL' ? filteredTickets : filteredTickets.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      renderTickets(pageData);
      renderPaginationControls();
    }

    function openQuickImageModal(scanFileName) {
      if (!scanFileName) return;

      const firstFile = scanFileName.split(',')[0].trim();
      const quickImg = document.getElementById('quickViewerImg');
      quickImg.src = `./scans/${firstFile}`;

      if (quickViewerInstance) {
        quickViewerInstance.destroy();
      }

      quickViewerInstance = new Viewer(quickImg, {
        hidden: function() {
          quickViewerInstance.destroy();
          quickViewerInstance = null;
        }
      });

      quickViewerInstance.show();
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';

      if (tickets.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No items found matching your criteria.</p>';
        return;
      }

      tickets.forEach((t) => {
        const globalIndex = filteredTickets.indexOf(t);
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.onclick = (e) => {
          if (e.target.closest('.setlist-toggle-btn') || e.target.closest('.related-btn') || e.target.closest('.edit-icon-btn')) return;
          openModal(globalIndex);
        };

        const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
        const firstImgFile = skenFiles[0] || '';
        const imgSrc = firstImgFile ? `./scans/${firstImgFile}` : '';

        const parsed = parseInfoText(t);

        const relatedItems = getRelatedItems(t);
        let relatedHTML = '';

        if (relatedItems.length > 0) {
          relatedHTML += '<div class="related-items-bar">';
          relatedItems.forEach(rel => {
            const relCat = getTicketCategory(rel);
            let icon = '🖼️';
            let label = 'Poster';

            if (relCat === 'Tickets') { icon = '🎫'; label = 'Ticket'; }
            else if (relCat === 'Passes') { icon = '🪪'; label = 'Pass'; }
            else if (relCat === 'Programs') { icon = '📖'; label = 'Program'; }

            const relFile = (rel.SOUBOR_SKEN || '').split(',')[0].trim();

            relatedHTML += `
              <button class="related-btn" title="Click to view image" onclick="event.stopPropagation(); openQuickImageModal('${relFile}')">
                ${icon} View ${label}
              </button>
            `;
          });
          relatedHTML += '</div>';
        }

        const donorVal = t.CONTRIBUTOR_TEXT || t.ZDROJ_POSKYTNUL || '';
        const donorHTML = isValidValue(donorVal) ? `<span class="source-val">${donorVal}</span>` : '';

        const metaRowHTML = donorHTML ? `
          <div class="meta-details-row">
            ${donorHTML}
          </div>` : '';

        let supportActHTML = '';
        if (isValidValue(t.SUPPORTING_ACT)) {
          supportActHTML = `<div class="card-support-tag">🎸 Support: ${t.SUPPORTING_ACT.trim()}</div>`;
        }

        let setlistSection = '';
        const setlistStr = t.SETLIST || '';
        const songCount = parseInt(t.POCET_SKLADEB) || 0;
        
        if (setlistStr && isValidValue(setlistStr) && songCount > 0) {
          const songs = setlistStr.split(',').map(s => s.trim());
          const listItems = songs.map(s => `<li>${s}</li>`).join('');
          setlistSection = `
            <button class="setlist-toggle-btn has-setlist" onclick="event.stopPropagation(); toggleSetlist('${globalIndex}')">🎵 View Setlist (${songCount})</button>
            <div class="setlist-content" id="setlist-${globalIndex}"><ol>${listItems}</ol></div>
          `;
        }

        const editUrl = `edit_ticket.html?id=${encodeURIComponent(t.ID_LISTKU || '')}`;

        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imgSrc ? `<img src="${imgSrc}" alt="Ticket Scan" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzMzMyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4='">` : ''}
          </div>
          <div class="card-content">
            <div class="card-header-row">
              <div class="tour-name">${t.TURNE || 'UNKNOWN TOUR'}</div>
              <a href="${editUrl}" target="_blank" class="edit-icon-btn" onclick="event.stopPropagation();" title="Edit this record">✏️ Edit</a>
            </div>
            ${parsed.date ? `<div class="card-date">${parsed.date}</div>` : ''}
            <div class="info-text">${parsed.text}</div>
            ${supportActHTML}
            
            ${relatedHTML}
            ${metaRowHTML}
            ${setlistSection}
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    function renderPaginationControls() {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';
      if (pageSize === 'ALL' || filteredTickets.length <= pageSize) return;

      const totalPages = Math.ceil(filteredTickets.length / pageSize);

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn'; prevBtn.textContent = '◄ Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) {
            const dots = document.createElement('span'); dots.textContent = '...'; dots.style.color = 'var(--text-muted)';
            container.appendChild(dots);
          }
          continue;
        }
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`; pageBtn.textContent = i;
        pageBtn.onclick = () => { currentPage = i; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        container.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn'; nextBtn.textContent = 'Next ►';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(nextBtn);
    }

    function toggleSetlist(id) {
      const el = document.getElementById(`setlist-${id}`);
      if (el) el.classList.toggle('open');
    }

    function openModal(index) {
      if (index < 0 || index >= filteredTickets.length) return;
      currentModalIndex = index;
      const t = filteredTickets[currentModalIndex];

      if (imageViewerInstance) { imageViewerInstance.destroy(); imageViewerInstance = null; }

      const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
      const modalImg = document.getElementById('modalImg');
      const thumbContainer = document.getElementById('modalThumbnails');
      thumbContainer.innerHTML = '';

      if (skenFiles.length > 0) {
        modalImg.src = `./scans/${skenFiles[0]}`;
        if (skenFiles.length > 1) {
          skenFiles.forEach((file, idx) => {
            const thumb = document.createElement('img');
            thumb.className = `modal-thumb ${idx === 0 ? 'active' : ''}`;
            thumb.src = `./scans/${file}`;
            thumb.onclick = () => {
              modalImg.src = `./scans/${file}`;
              document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');
            };
            thumbContainer.appendChild(thumb);
          });
        }
      } else { modalImg.src = ''; }

      setTimeout(() => {
        imageViewerInstance = new Viewer(modalImg, { toolbar: true, navbar: false, title: false });
      }, 100);

      const parsed = parseInfoText(t);
      document.getElementById('modalTour').textContent = t.TURNE || 'UNKNOWN TOUR';
      document.getElementById('modalDate').textContent = parsed.date || '';
      document.getElementById('modalInfo').textContent = parsed.text || '';

      const donorVal = t.CONTRIBUTOR_TEXT || t.ZDROJ_POSKYTNUL || '';
      const srcGroup = document.getElementById('modalSourceGroup');
      if (isValidValue(donorVal)) {
        document.getElementById('modalSource').textContent = donorVal;
        srcGroup.style.display = 'block';
      } else { srcGroup.style.display = 'none'; }

      const supportGroup = document.getElementById('modalSupportGroup');
      if (isValidValue(t.SUPPORTING_ACT)) {
        document.getElementById('modalSupport').textContent = t.SUPPORTING_ACT.trim();
        supportGroup.style.display = 'block';
      } else { supportGroup.style.display = 'none'; }

      const priceGroup = document.getElementById('modalPriceGroup');
      if (isValidValue(t.CENA) && t.CENA !== '0.00') {
        document.getElementById('modalPrice').textContent = `${t.CENA} ${t.MENA || ''}`;
        priceGroup.style.display = 'block';
      } else { priceGroup.style.display = 'none'; }

      const seatGroup = document.getElementById('modalSeatGroup');
      if (isValidValue(t.SEKTOR_RADA_SEDADLO)) {
        document.getElementById('modalSeat').textContent = t.SEKTOR_RADA_SEDADLO;
        seatGroup.style.display = 'block';
      } else { seatGroup.style.display = 'none'; }

      // External Media Container (YouTube, Setlist.fm, Press Reviews)
      const mediaContainer = document.getElementById('modalMediaContainer');
      let mediaHTML = '';

      if (isValidValue(t.YOUTUBE_URL)) {
        mediaHTML += `
          <div class="media-embed-box">
            <h4>🎬 Concert Video / Bootleg</h4>
            <div style="margin-bottom: 8px;">
              <a href="${t.YOUTUBE_URL}" target="_blank" class="media-link-btn">▶ Watch Video on YouTube ↗</a>
            </div>
          </div>`;
      }

      if (isValidValue(t.REVIEW_URL)) {
        mediaHTML += `
          <div class="media-embed-box">
            <h4>📰 Press & Archive Review</h4>
            <iframe src="${t.REVIEW_URL}" width="100%" height="250" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen style="border-radius:6px; background:#000;"></iframe>
          </div>`;
      }

      if (isValidValue(t.SETLIST_URL)) {
        mediaHTML += `
          <div class="media-links-bar">
            <a href="${t.SETLIST_URL}" target="_blank" class="media-link-btn">📊 View Show Details on Setlist.fm ↗</a>
          </div>`;
      }

      mediaContainer.innerHTML = mediaHTML;

      // Full Setlist Section
      const modalSetlistSec = document.getElementById('modalSetlistSection');
      const setlistStr = t.SETLIST || '';
      const songCount = parseInt(t.POCET_SKLADEB) || 0;

      if (setlistStr && isValidValue(setlistStr) && songCount > 0) {
        const songs = setlistStr.split(',').map(s => s.trim());
        const listItems = songs.map(s => `<li>${s}</li>`).join('');
        modalSetlistSec.innerHTML = `<h4 style="color: var(--accent-yellow); margin-bottom: 10px;">🎵 Full Setlist (${songCount} songs)</h4><ol style="padding-left: 20px; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">${listItems}</ol>`;
      } else { modalSetlistSec.innerHTML = ''; }

      document.getElementById('modalCounter').textContent = `${currentModalIndex + 1} / ${filteredTickets.length}`;
      document.getElementById('modalPrevBtn').disabled = currentModalIndex === 0;
      document.getElementById('modalNextBtn').disabled = currentModalIndex === filteredTickets.length - 1;

      document.getElementById('detailModal').classList.add('active');
    }

    function navigateModal(direction) {
      const newIndex = currentModalIndex + direction;
      if (newIndex >= 0 && newIndex < filteredTickets.length) openModal(newIndex);
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      if (imageViewerInstance) { imageViewerInstance.destroy(); imageViewerInstance = null; }
      currentModalIndex = -1;
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detailModal') closeModal();
    }
  </script>
</body>
