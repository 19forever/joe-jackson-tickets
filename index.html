<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Jackson´s Memorabilia Museum</title>

  <!-- Favicon (JJ Icon) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgdmlld0JveD0iMCAwIDY0IDY0Ij4KICA8cmVjdCB3aWR0aD0iNjQiIGhlaWdodD0iNjQiIHJ4PSIxMiIgZmlsbD0iI2Y5NzMxNiIvPgogIDx0ZXh0IHg9IjUwJSIgeT0iNTUlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjMDAwMDAwIiBmb250LWZhbWlseT0iLWFwcGxlLXN5c3RlbSwgQmxpbmtNYWNTeXN0ZW1Gb250LCAnU2Vnb2UgVUknLCBSb2JvdG8sIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMzYiIGxldHRlci1zcGFjaW5nPSItMiI+Sko8L3RleHQ+Cjwvc3ZnPg==">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Viewer.js (Image Zoom & Inspection) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 0 40px 40px 40px;
      min-height: 100vh;
    }

    .viewer-container { z-index: 99999 !important; }

    .top-header-container {
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      z-index: 100;
      padding-top: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-left { display: flex; align-items: center; gap: 15px; }

    .logo {
      background-color: #f97316;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .year-badge {
      background-color: transparent;
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .title-area p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    /* Banner "On This Day in History" */
    .on-this-day-banner {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.15), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 15px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .on-this-day-banner.active { display: flex; }

    .otd-left { display: flex; align-items: center; gap: 12px; }

    .otd-icon {
      font-size: 1.3rem;
      background: rgba(250, 204, 21, 0.2);
      padding: 6px 10px;
      border-radius: 6px;
    }

    .otd-text h4 {
      font-size: 0.85rem;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .otd-text p {
      font-size: 0.85rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .otd-btn {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .otd-btn:hover { background-color: #fde047; }

    .category-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover { border-color: #38bdf8; color: #fff; }
    .tab-btn.active { background-color: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

    .controls {
      display: grid;
      grid-template-columns: 2fr auto 1fr 1fr 110px auto;
      gap: 10px;
      background-color: var(--bg-panel);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    @media (max-width: 1200px) {
      .controls { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* Container pro vyhledávací pole s Clear tlačítkem */
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-input-wrapper input {
      background-color: var(--bg-main);
      border: 1px solid var(--accent-yellow) !important;
      color: var(--text-main);
      padding: 8px 36px 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      box-shadow: 0 0 4px rgba(250, 204, 21, 0.15);
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .search-input-wrapper input:focus, .search-input-wrapper input:hover {
      box-shadow: 0 0 8px rgba(250, 204, 21, 0.35);
    }

    .search-clear-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
      padding: 2px 4px;
      border-radius: 50%;
      transition: color 0.2s, background 0.2s;
    }

    .search-clear-btn:hover {
      color: var(--accent-yellow);
      background: rgba(255, 255, 255, 0.1);
    }

    .surprise-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .surprise-btn:hover {
      background-color: var(--accent-yellow);
      color: #000;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
    }

    .controls select {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls select:focus { border-color: var(--accent-blue); }

    .layout-toggles { display: flex; gap: 5px; }

    .toggle-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 100%;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .toggle-btn.active { background-color: var(--accent-yellow); color: #000; border-color: var(--accent-yellow); }

    .tickets-container.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .tickets-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tickets-container.list-view .ticket-card { flex-direction: row; align-items: center; height: auto; }
    .tickets-container.list-view .card-img-wrapper { width: 220px; height: 160px; flex-shrink: 0; }

    .ticket-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .ticket-card:hover { border-color: #38bdf8; transform: translateY(-2px); }

    .card-img-wrapper {
      position: relative;
      height: 220px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .card-content { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }

    .card-date { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .info-text { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); line-height: 1.4; margin-bottom: 8px; flex-grow: 1; }

    /* Related Item Badge Buttons */
    .related-items-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 6px;
    }

    .related-btn {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .related-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
      border-color: #38bdf8;
    }

    .collapsible-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setlist-toggle-btn, .lineup-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      flex-grow: 1;
    }

    .setlist-toggle-btn.has-setlist {
      background: rgba(250, 204, 21, 0.12);
      border-color: rgba(250, 204, 21, 0.5);
      color: var(--accent-yellow);
      font-weight: 700;
    }

    .setlist-toggle-btn.has-setlist:hover {
      background: rgba(250, 204, 21, 0.25);
    }

    .lineup-toggle-btn.has-lineup {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.5);
      color: var(--accent-blue);
      font-weight: 700;
    }

    .lineup-toggle-btn.has-lineup:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    .external-link-icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .external-link-icon-btn:hover {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: rgba(250, 204, 21, 0.15);
    }

    .collapsible-content {
      display: none;
      margin-top: 8px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .collapsible-content.open { display: block; }
    .collapsible-content ol, .collapsible-content ul { padding-left: 20px; margin: 8px 0; }

    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .page-btn {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .page-btn.active {
      background-color: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
      font-weight: 700;
    }

    /* Modal / Detail View Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 950px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .modal-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border-color);
    }

    .modal-nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-nav-btn:hover:not(:disabled) { border-color: var(--accent-blue); color: var(--accent-blue); }
    .modal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-edit-btn {
      background: rgba(250, 204, 21, 0.12);
      border: 1px solid rgba(250, 204, 21, 0.5);
      color: var(--accent-yellow);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .modal-edit-btn:hover { background: rgba(250, 204, 21, 0.25); border-color: var(--accent-yellow); }

    .modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: none; color: #fff;
      font-size: 1.2rem; width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-close:hover { background: rgba(239, 68, 68, 0.8); }

    .modal-img-container {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 52vh;
      object-fit: contain;
      border-radius: 6px;
      cursor: zoom-in;
    }

    .modal-thumbnails {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .modal-thumb {
      width: 50px;
      height: 38px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      opacity: 0.6;
    }

    .modal-thumb:hover, .modal-thumb.active { opacity: 1; border-color: var(--accent-yellow); }

    .modal-body { padding: 25px; }
    .modal-date { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .modal-title { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); margin-bottom: 15px; }

    .modal-grid {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .modal-grid-item span { display: block; color: var(--text-muted); font-size: 0.75rem; margin-bottom: 2px; }
    .modal-grid-item strong { font-size: 0.9rem; color: var(--text-main); }

    /* Flashcard 2-Column Layout for Lineup & Setlist */
    .flashcard-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .flashcard-col-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .flashcard-col-box h4 {
      font-size: 0.85rem;
      text-transform: uppercase;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .media-embed-box {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .media-embed-box h4 {
      font-size: 0.85rem;
      color: var(--accent-blue);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .media-links-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .media-link-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .media-link-btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
  </style>
</head>
<body>

  <div class="top-header-container">
    <header>
      <div class="header-left">
        <div class="logo">JJ</div>
        <div class="title-area">
          <h1>Joe Jackson´s Memorabilia Museum <span class="year-badge" id="yearBadge">...</span></h1>
          <p>Historical archive of Joe Jackson´s concert tickets, venues & memorabilia</p>
        </div>
      </div>
    </header>

    <!-- On This Day in History Banner -->
    <div class="on-this-day-banner" id="otdBanner">
      <div class="otd-left">
        <div class="otd-icon">📅</div>
        <div class="otd-text">
          <h4>On This Day In History</h4>
          <p id="otdTitle">...</p>
        </div>
      </div>
      <button class="otd-btn" id="otdBtn">🎫 View Anniversary Show</button>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="controls">
      <div class="search-input-wrapper">
        <input type="text" id="searchInput" placeholder="🔍 Search by city, venue, date..." onkeyup="handleSearchInput()">
        <button class="search-clear-btn" id="searchClearBtn" onclick="clearSearchInput()" title="Clear search">✕</button>
      </div>

      <button class="surprise-btn" onclick="openSurpriseTicket()" title="Open a random memorabilia record">🎲 Surprise Me!</button>

      <select id="yearFilter" onchange="filterData()"><option value="">All Years</option></select>
      <select id="cityFilter" onchange="filterData()"><option value="">All Cities</option></select>
      <select id="sortFilter" onchange="filterData()">
        <option value="oldest">Date (Oldest First)</option>
        <option value="newest">Date (Newest First)</option>
      </select>
      <select id="pageSizeFilter" onchange="changePageSize()">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="ALL">ALL</option>
      </select>
      <div class="layout-toggles">
        <button class="toggle-btn active" id="btnGrid" onclick="setLayout('grid')">⊞</button>
        <button class="toggle-btn" id="btnList" onclick="setLayout('list')">≡</button>
      </div>
    </div>
  </div>

  <div id="ticketsContainer" class="tickets-container grid-view"></div>
  <div id="paginationContainer" class="pagination-container"></div>

  <!-- Detail Modal Window (Flashcard) -->
  <div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <div class="modal-nav-bar">
        <button class="modal-nav-btn" id="modalPrevBtn" onclick="navigateModal(-1)">◄ Previous</button>
        <div class="modal-counter" id="modalCounter">0 / 0</div>
        <div style="display: flex; gap: 10px; align-items: center;">
          <a href="#" id="modalEditLink" target="_blank" class="modal-edit-btn" title="Edit this record">✏️ Edit</a>
          <button class="modal-nav-btn" id="modalNextBtn" onclick="navigateModal(1)">Next ►</button>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
      </div>

      <div class="modal-img-container">
        <div id="modalViewerWrapper">
          <img id="modalImg" src="" alt="Ticket Full View">
        </div>
        <div class="modal-thumbnails" id="modalThumbnails"></div>
      </div>

      <div class="modal-body">
        <div class="modal-date" id="modalDate"></div>
        <div class="modal-title" id="modalInfo"></div>
        
        <div class="modal-grid" id="modalGrid">
          <div class="modal-grid-item" id="modalSupportGroup">
            <span>Supporting Act</span>
            <strong id="modalSupport"></strong>
          </div>
          <div class="modal-grid-item" id="modalSeatGroup">
            <span>Seating / Section</span>
            <strong id="modalSeat"></strong>
          </div>
        </div>

        <!-- 2-Column Flashcard Section: Line-up & Setlist -->
        <div class="flashcard-columns" id="modalColumnsSection"></div>

        <!-- External Media Links & Embeds -->
        <div id="modalMediaContainer"></div>
      </div>
    </div>
  </div>

  <!-- Skrytý prvek pro spuštění Lupy (Viewer.js) nad souvisejícími obrázky -->
  <img id="quickViewerImg" src="" style="display: none;" alt="Quick Viewer">

  <script>
    let allTickets = [];
    let filteredTickets = [];
    let currentLayout = 'grid';
    let currentPage = 1;
    let pageSize = 50;
    let currentCategory = 'Tickets';
    let currentModalIndex = -1;

    let imageViewerInstance = null;
    let quickViewerInstance = null;

    function isValidValue(val) {
      if (!val) return false;
      const clean = String(val).trim().toLowerCase();
      return clean !== '' && clean !== 'není k dispozici' && clean !== 'n/a' && clean !== 'undefined' && clean !== 'null';
    }

    function getTicketCategory(t) {
      if (t.KATEGORIE && t.KATEGORIE.trim()) {
        const cat = t.KATEGORIE.trim().toLowerCase();
        if (cat.includes('pass')) return 'Passes';
        if (cat.includes('program')) return 'Programs';
        if (cat.includes('poster')) return 'Posters';
        if (cat.includes('shirt') || cat.includes('t-shirt') || cat.includes('tričko')) return 'T-shirts';
        if (cat.includes('memo')) return 'Memorabilia';
        if (cat.includes('ticket')) return 'Tickets';
      }
      return 'Tickets';
    }

    function parseInfoText(t) {
      let rawText = (t.INFO_TEXT || '').trim();
      let explicitDate = (t.DATUM || '').trim();
      const dateRegex = /\b(\d{1,2}(?:st|nd|rd|th)?\s+[A-Za-z]+\s+\d{4}|\d{4}-\d{2}-\d{2}|\d{1,2}\.\d{1,2}\.\d{4})\b/i;
      const match = rawText.match(dateRegex);

      let extractedDate = explicitDate;
      let cleanedText = rawText;

      if (match) {
        if (!extractedDate) extractedDate = match[0];
        cleanedText = rawText.replace(match[0], '').replace(/^[\s–—\-]+|[\s–—\-]+$/g, '').trim();
      }

      return { date: extractedDate, text: cleanedText || rawText };
    }

    function extractCityOnly(t) {
      if (isValidValue(t.MESTO)) {
        return t.MESTO.split('-')[0].trim();
      }
      const parsed = parseInfoText(t);
      if (parsed.text && parsed.text.trim()) {
        const cityCandidate = parsed.text.split(',')[0].split('-')[0].trim();
        return cityCandidate;
      }
      return '';
    }

    function parseToDate(t) {
      const parsed = parseInfoText(t);
      if (!parsed.date) return new Date(0);
      let cleanDateStr = parsed.date.replace(/(\d+)(st|nd|rd|th)/i, '$1').replace(/\./g, '/');
      let timestamp = Date.parse(cleanDateStr);
      return isNaN(timestamp) ? new Date(0) : new Date(timestamp);
    }

    function handleSearchInput() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('searchClearBtn');
      clearBtn.style.display = input.value.trim().length > 0 ? 'block' : 'none';
      filterData();
    }

    function clearSearchInput() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('searchClearBtn');
      input.value = '';
      clearBtn.style.display = 'none';
      filterData();
    }

    function openSurpriseTicket() {
      if (!filteredTickets || filteredTickets.length === 0) {
        alert("No tickets available to pick from!");
        return;
      }
      const randomIndex = Math.floor(Math.random() * filteredTickets.length);
      openModal(randomIndex);
    }

    function getRelatedItems(currentRecord) {
      const currentInfo = (currentRecord.INFO_TEXT || '').trim().toLowerCase();
      if (!currentInfo) return [];

      return allTickets.filter(item => {
        if (item.ID_LISTKU === currentRecord.ID_LISTKU) return false;
        const itemInfo = (item.INFO_TEXT || '').trim().toLowerCase();
        return itemInfo === currentInfo;
      });
    }

    function checkOnThisDayAnniversary() {
      const today = new Date();
      const currentDay = today.getDate();
      const currentMonth = today.getMonth();

      const anniversaries = allTickets.filter(t => {
        const d = parseToDate(t);
        return d.getTime() > 0 && d.getDate() === currentDay && d.getMonth() === currentMonth;
      });

      if (anniversaries.length > 0) {
        const selected = anniversaries[0];
        const parsed = parseInfoText(selected);
        const concertDate = parseToDate(selected);
        const yearsAgo = today.getFullYear() - concertDate.getFullYear();

        const banner = document.getElementById('otdBanner');
        const titleEl = document.getElementById('otdTitle');
        const btn = document.getElementById('otdBtn');

        let text = `<strong>${yearsAgo} years ago</strong> (${concertDate.getFullYear()}): Joe Jackson played in ${parsed.text}`;
        if (anniversaries.length > 1) {
          text += ` <em>(+${anniversaries.length - 1} more show today)</em>`;
        }

        titleEl.innerHTML = text;
        banner.classList.add('active');

        btn.onclick = () => {
          const targetIndex = filteredTickets.indexOf(selected);
          if (targetIndex !== -1) {
            openModal(targetIndex);
          } else {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            document.getElementById('yearFilter').value = '';
            document.getElementById('cityFilter').value = '';
            currentCategory = 'ALL';
            filterData();
            setTimeout(() => {
              openModal(filteredTickets.indexOf(selected));
            }, 100);
          }
        };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse('joe_jackson_tickets_master_with_setlists.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allTickets = results.data;
          updateYearBadge();
          populateFilters();
          filterData();
          checkOnThisDayAnniversary();
        }
      });
    });

    function updateYearBadge() {
      const years = allTickets
        .map(t => parseToDate(t).getFullYear())
        .filter(y => y > 1900);
      if (years.length > 0) {
        const minYear = Math.min(...years);
        const maxYear = Math.max(...years);
        document.getElementById('yearBadge').textContent = `${minYear} – ${maxYear}`;
      }
    }

    function populateFilters() {
      // Populating Year Filter
      const yearSelect = document.getElementById('yearFilter');
      const yearsSet = new Set();

      allTickets.forEach(t => {
        const y = parseToDate(t).getFullYear();
        if (y > 1900) yearsSet.add(y);
      });

      const sortedYears = [...yearsSet].sort((a, b) => b - a);
      sortedYears.forEach(year => {
        const opt = document.createElement('option');
        opt.value = year;
        opt.textContent = year;
        yearSelect.appendChild(opt);
      });

      // Populating City Filter
      const citySelect = document.getElementById('cityFilter');
      const citySet = new Set();

      allTickets.forEach(t => {
        const cityName = extractCityOnly(t);
        if (cityName) citySet.add(cityName);
      });

      const uniqueCities = [...citySet].sort((a, b) => a.localeCompare(b));
      
      uniqueCities.forEach(city => {
        const opt = document.createElement('option');
        opt.value = city; 
        opt.textContent = city;
        citySelect.appendChild(opt);
      });
    }

    function renderCategoryTabs(matchesBeforeCategoryFilter) {
      const tabsContainer = document.getElementById('categoryTabs');
      tabsContainer.innerHTML = '';

      const counts = { 'Tickets': 0, 'Passes': 0, 'Programs': 0, 'Posters': 0, 'T-shirts': 0, 'Memorabilia': 0, 'ALL': matchesBeforeCategoryFilter.length };

      matchesBeforeCategoryFilter.forEach(t => {
        const cat = getTicketCategory(t);
        if (counts[cat] !== undefined) counts[cat]++;
      });

      const categoryOrder = ['Tickets', 'Passes', 'Programs', 'Posters', 'T-shirts', 'Memorabilia', 'ALL'];
      const categoryLabels = { 'Tickets': '🎫 Tickets', 'Passes': '🪪 Passes', 'Programs': '📖 Programs', 'Posters': '🖼️ Posters', 'T-shirts': '🎽 T-shirts', 'Memorabilia': '⭐ Memorabilia', 'ALL': '✨ All Records' };

      categoryOrder.forEach(catKey => {
        const count = counts[catKey];
        if (count > 0 || catKey === 'ALL' || catKey === 'Tickets') {
          const btn = document.createElement('button');
          btn.className = `tab-btn ${currentCategory === catKey ? 'active' : ''}`;
          btn.innerHTML = `${categoryLabels[catKey]} <span style="opacity: 0.75; font-size: 0.8em;">(${count})</span>`;
          btn.onclick = () => { currentCategory = catKey; filterData(); };
          tabsContainer.appendChild(btn);
        }
      });
    }

    function setLayout(layout) {
      currentLayout = layout;
      document.getElementById('btnGrid').className = `toggle-btn ${layout === 'grid' ? 'active' : ''}`;
      document.getElementById('btnList').className = `toggle-btn ${layout === 'list' ? 'active' : ''}`;
      document.getElementById('ticketsContainer').className = `tickets-container ${layout}-view`;
      renderPaginated();
    }

    function changePageSize() {
      const val = document.getElementById('pageSizeFilter').value;
      pageSize = val === 'ALL' ? 'ALL' : parseInt(val);
      currentPage = 1;
      renderPaginated();
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedYear = document.getElementById('yearFilter').value;
      const selectedCity = document.getElementById('cityFilter').value;
      const sort = document.getElementById('sortFilter').value;

      const matchesBase = allTickets.filter(t => {
        const parsed = parseInfoText(t);
        const cityVal = extractCityOnly(t);
        const itemYear = parseToDate(t).getFullYear();

        const qMatch = !query || 
          (t.INFO_TEXT || '').toLowerCase().includes(query) ||
          (t.MESTO || '').toLowerCase().includes(query) ||
          (t.SUPPORTING_ACT || '').toLowerCase().includes(query) ||
          (t.LINEUP || '').toLowerCase().includes(query) ||
          (t.SETLIST || '').toLowerCase().includes(query);
          
        const yMatch = !selectedYear || String(itemYear) === String(selectedYear);
        const cMatch = !selectedCity || cityVal.toLowerCase() === selectedCity.toLowerCase() || (t.INFO_TEXT || '').toLowerCase().includes(selectedCity.toLowerCase());
        return qMatch && yMatch && cMatch;
      });

      renderCategoryTabs(matchesBase);

      filteredTickets = matchesBase.filter(t => {
        if (currentCategory === 'ALL') return true;
        return getTicketCategory(t).toLowerCase() === currentCategory.toLowerCase();
      });

      filteredTickets.sort((a, b) => {
        const dateA = parseToDate(a);
        const dateB = parseToDate(b);
        return sort === 'newest' ? dateB - dateA : dateA - dateB;
      });

      currentPage = 1;
      renderPaginated();
    }

    function renderPaginated() {
      let pageData = pageSize === 'ALL' ? filteredTickets : filteredTickets.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      renderTickets(pageData);
      renderPaginationControls();
    }

    function openQuickImageModal(scanFileName) {
      if (!scanFileName) return;

      const firstFile = scanFileName.split(',')[0].trim();
      const quickImg = document.getElementById('quickViewerImg');
      quickImg.src = `./scans/${firstFile}`;

      if (quickViewerInstance) {
        quickViewerInstance.destroy();
      }

      quickViewerInstance = new Viewer(quickImg, {
        hidden: function() {
          quickViewerInstance.destroy();
          quickViewerInstance = null;
        }
      });

      quickViewerInstance.show();
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';

      if (tickets.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No items found matching your criteria.</p>';
        return;
      }

      tickets.forEach((t) => {
        const globalIndex = filteredTickets.indexOf(t);
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.onclick = (e) => {
          if (e.target.closest('.setlist-toggle-btn') || e.target.closest('.lineup-toggle-btn') || e.target.closest('.external-link-icon-btn') || e.target.closest('.related-btn')) return;
          openModal(globalIndex);
        };

        const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
        const firstImgFile = skenFiles[0] || '';
        const imgSrc = firstImgFile ? `./scans/${firstImgFile}` : '';

        const parsed = parseInfoText(t);

        const relatedItems = getRelatedItems(t);
        let relatedHTML = '';

        if (relatedItems.length > 0) {
          relatedHTML += '<div class="related-items-bar">';
          relatedItems.forEach(rel => {
            const relCat = getTicketCategory(rel);
            let icon = '🖼️';
            let label = 'Poster';

            if (relCat === 'Tickets') { icon = '🎫'; label = 'Ticket'; }
            else if (relCat === 'Passes') { icon = '🪪'; label = 'Pass'; }
            else if (relCat === 'Programs') { icon = '📖'; label = 'Program'; }

            const relFile = (rel.SOUBOR_SKEN || '').split(',')[0].trim();

            relatedHTML += `
              <button class="related-btn" title="Click to view image" onclick="event.stopPropagation(); openQuickImageModal('${relFile}')">
                ${icon} View ${label}
              </button>
            `;
          });
          relatedHTML += '</div>';
        }

        // Setlist & Lineup controls
        let collapsibleGroupHTML = '';
        const setlistStr = t.SETLIST || '';
        const songCount = parseInt(t.POCET_SKLADEB) || 0;
        const setlistUrl = t.SETLIST_URL || '';
        const lineupStr = t.LINEUP || '';

        const hasSetlist = setlistStr && isValidValue(setlistStr) && songCount > 0;
        const hasLineup = lineupStr && isValidValue(lineupStr);

        if (hasSetlist || hasLineup || setlistUrl) {
          collapsibleGroupHTML += '<div class="collapsible-group">';
          
          // 1. Tlačítko na setlist.fm vlevo od tlačítka "Setlist"
          if (setlistUrl && isValidValue(setlistUrl)) {
            collapsibleGroupHTML += `
              <a href="${setlistUrl}" target="_blank" class="external-link-icon-btn" title="Open directly on Setlist.fm ↗" onclick="event.stopPropagation();">🔗</a>
            `;
          }

          // 2. Tlačítko "Setlist"
          if (hasSetlist) {
            collapsibleGroupHTML += `
              <button class="setlist-toggle-btn has-setlist" onclick="event.stopPropagation(); toggleCollapsible('setlist-${globalIndex}')">🎵 Setlist (${songCount})</button>
            `;
          }

          // 3. Tlačítko "Line-up"
          if (hasLineup) {
            collapsibleGroupHTML += `
              <button class="lineup-toggle-btn has-lineup" onclick="event.stopPropagation(); toggleCollapsible('lineup-${globalIndex}')">👥 Line-up</button>
            `;
          }

          collapsibleGroupHTML += '</div>';

          if (hasSetlist) {
            const songs = setlistStr.split(',').map(s => s.trim());
            const listItems = songs.map(s => `<li>${s}</li>`).join('');
            collapsibleGroupHTML += `<div class="collapsible-content" id="setlist-${globalIndex}"><ol>${listItems}</ol></div>`;
          }

          if (hasLineup) {
            const members = lineupStr.split(';').map(m => m.trim());
            const memberItems = members.map(m => `<li>${m}</li>`).join('');
            collapsibleGroupHTML += `<div class="collapsible-content" id="lineup-${globalIndex}"><ul>${memberItems}</ul></div>`;
          }
        }

        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imgSrc ? `<img src="${imgSrc}" alt="Ticket Scan" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzMzMyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4='">` : ''}
          </div>
          <div class="card-content">
            ${parsed.date ? `<div class="card-date">${parsed.date}</div>` : ''}
            <div class="info-text">${parsed.text}</div>
            ${relatedHTML}
            ${collapsibleGroupHTML}
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    function renderPaginationControls() {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';
      if (pageSize === 'ALL' || filteredTickets.length <= pageSize) return;

      const totalPages = Math.ceil(filteredTickets.length / pageSize);

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn'; prevBtn.textContent = '◄ Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => { currentPage--; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) {
            const dots = document.createElement('span'); dots.textContent = '...'; dots.style.color = 'var(--text-muted)';
            container.appendChild(dots);
          }
          continue;
        }
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`; pageBtn.textContent = i;
        pageBtn.onclick = () => { currentPage = i; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        container.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn'; nextBtn.textContent = 'Next ►';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => { currentPage++; renderPaginated(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      container.appendChild(nextBtn);
    }

    function toggleCollapsible(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('open');
    }

    function openModal(index) {
      if (index < 0 || index >= filteredTickets.length) return;
      currentModalIndex = index;
      const t = filteredTickets[currentModalIndex];

      if (imageViewerInstance) { imageViewerInstance.destroy(); imageViewerInstance = null; }

      const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
      const modalImg = document.getElementById('modalImg');
      const thumbContainer = document.getElementById('modalThumbnails');
      thumbContainer.innerHTML = '';

      if (skenFiles.length > 0) {
        modalImg.src = `./scans/${skenFiles[0]}`;
        if (skenFiles.length > 1) {
          skenFiles.forEach((file, idx) => {
            const thumb = document.createElement('img');
            thumb.className = `modal-thumb ${idx === 0 ? 'active' : ''}`;
            thumb.src = `./scans/${file}`;
            thumb.onclick = () => {
              modalImg.src = `./scans/${file}`;
              document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');
            };
            thumbContainer.appendChild(thumb);
          });
        }
      } else { modalImg.src = ''; }

      setTimeout(() => {
        imageViewerInstance = new Viewer(modalImg, { toolbar: true, navbar: false, title: false });
      }, 100);

      const parsed = parseInfoText(t);
      document.getElementById('modalDate').textContent = parsed.date || '';
      document.getElementById('modalInfo').textContent = parsed.text || '';

      // Nastavení odkazu na editaci ve Flash Card (v horní liště vpravo)
      const editLink = document.getElementById('modalEditLink');
      if (editLink) {
        editLink.href = `edit_ticket.html?id=${encodeURIComponent(t.ID_LISTKU || '')}`;
      }

      const modalGrid = document.getElementById('modalGrid');
      const supportGroup = document.getElementById('modalSupportGroup');
      const seatGroup = document.getElementById('modalSeatGroup');
      
      let hasGridItems = false;

      if (isValidValue(t.SUPPORTING_ACT)) {
        document.getElementById('modalSupport').textContent = t.SUPPORTING_ACT.trim();
        supportGroup.style.display = 'block';
        hasGridItems = true;
      } else { supportGroup.style.display = 'none'; }

      if (isValidValue(t.SEKTOR_RADA_SEDADLO)) {
        document.getElementById('modalSeat').textContent = t.SEKTOR_RADA_SEDADLO;
        seatGroup.style.display = 'block';
        hasGridItems = true;
      } else { seatGroup.style.display = 'none'; }

      modalGrid.style.display = hasGridItems ? 'grid' : 'none';

      // 2-Column Flashcard Section: Lineup & Setlist
      const modalColsSec = document.getElementById('modalColumnsSection');
      let colsHTML = '';

      const lineupStr = t.LINEUP || '';
      const setlistStr = t.SETLIST || '';
      const songCount = parseInt(t.POCET_SKLADEB) || 0;

      const hasLineup = isValidValue(lineupStr);
      const hasSetlist = setlistStr && isValidValue(setlistStr) && songCount > 0;

      if (hasLineup) {
        const members = lineupStr.split(';').map(m => m.trim());
        const memberItems = members.map(m => `<li>${m}</li>`).join('');
        colsHTML += `
          <div class="flashcard-col-box">
            <h4 style="color: var(--accent-blue);">👥 Band Line-up</h4>
            <ul style="padding-left: 20px; color: var(--text-main); font-size: 0.85rem; line-height: 1.6;">${memberItems}</ul>
          </div>`;
      }

      if (hasSetlist) {
        const songs = setlistStr.split(',').map(s => s.trim());
        const listItems = songs.map(s => `<li>${s}</li>`).join('');
        colsHTML += `
          <div class="flashcard-col-box">
            <h4 style="color: var(--accent-yellow);">🎵 Full Setlist (${songCount} songs)</h4>
            <ol style="padding-left: 20px; color: var(--text-muted); font-size: 0.85rem; line-height: 1.6;">${listItems}</ol>
          </div>`;
      }

      modalColsSec.innerHTML = colsHTML;

      // External Media Container (YouTube, Setlist.fm, Press Reviews)
      const mediaContainer = document.getElementById('modalMediaContainer');
      let mediaHTML = '';

      if (isValidValue(t.YOUTUBE_URL)) {
        mediaHTML += `
          <div class="media-embed-box">
            <h4>🎬 Concert Video / Bootleg</h4>
            <div style="margin-bottom: 8px;">
              <a href="${t.YOUTUBE_URL}" target="_blank" class="media-link-btn">▶ Watch Video on YouTube ↗</a>
            </div>
          </div>`;
      }

      if (isValidValue(t.REVIEW_URL)) {
        mediaHTML += `
          <div class="media-embed-box">
            <h4>📰 Press & Archive Review</h4>
            <iframe src="${t.REVIEW_URL}" width="100%" height="250" frameborder="0" webkitallowfullscreen="true" mozallowfullscreen="true" allowfullscreen style="border-radius:6px; background:#000;"></iframe>
          </div>`;
      }

      if (isValidValue(t.SETLIST_URL)) {
        mediaHTML += `
          <div class="media-links-bar">
            <a href="${t.SETLIST_URL}" target="_blank" class="media-link-btn">📊 View Show Details on Setlist.fm ↗</a>
          </div>`;
      }

      mediaContainer.innerHTML = mediaHTML;

      document.getElementById('modalCounter').textContent = `${currentModalIndex + 1} / ${filteredTickets.length}`;
      document.getElementById('modalPrevBtn').disabled = currentModalIndex === 0;
      document.getElementById('modalNextBtn').disabled = currentModalIndex === filteredTickets.length - 1;

      document.getElementById('detailModal').classList.add('active');
    }

    function navigateModal(direction) {
      const newIndex = currentModalIndex + direction;
      if (newIndex >= 0 && newIndex < filteredTickets.length) openModal(newIndex);
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      if (imageViewerInstance) { imageViewerInstance.destroy(); imageViewerInstance = null; }
      currentModalIndex = -1;
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detailModal') closeModal();
    }
  </script>
</body>
</html>
