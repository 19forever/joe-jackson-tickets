<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolf Thalmann´s Ticket Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Leaflet.js (Interactive Map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Viewer.js (Image Zoom & Inspection) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>

  <style>
    :root {
      --bg-main: #0a0f1c;
      --bg-panel: #111827;
      --bg-card: #151c2b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-yellow: #facc15;
      --border-color: #1f2937;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 0 40px 40px 40px;
      min-height: 100vh;
    }

    /* Fixed / Sticky Top Header Wrapper */
    .top-header-container {
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      z-index: 100;
      padding-top: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      background-color: #f97316;
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .year-badge {
      background-color: transparent;
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .stats-bar span {
      color: var(--border-color);
    }

    .stat-val-yellow { color: var(--accent-yellow); }
    .stat-val-white { color: #fff; }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 110px auto;
      gap: 12px;
      background-color: var(--bg-panel);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .controls input, .controls select {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
    }

    .controls input:focus, .controls select:focus {
      border-color: #3b82f6;
    }

    .layout-toggles {
      display: flex;
      gap: 5px;
    }

    .toggle-btn {
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 36px;
      height: 100%;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .toggle-btn.active {
      background-color: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
    }

    /* Grid Layout */
    .tickets-container.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* List Layout */
    .tickets-container.list-view {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .tickets-container.list-view .ticket-card {
      flex-direction: row;
      align-items: center;
      height: auto;
    }

    .tickets-container.list-view .card-img-wrapper {
      width: 180px;
      height: 120px;
      flex-shrink: 0;
    }

    .ticket-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .ticket-card:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
    }

    .card-img-wrapper {
      position: relative;
      height: 160px;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .tour-name {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .info-text {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .source-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .source-val {
      color: var(--text-main);
      text-align: right;
    }

    .setlist-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-top: 15px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    
    .setlist-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .setlist-content {
      display: none;
      margin-top: 10px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .setlist-content.open {
      display: block;
    }

    .setlist-content ol {
      padding-left: 20px;
      margin: 10px 0;
    }

    .setlist-content li {
      margin-bottom: 4px;
    }
    
    .setlist-link {
      color: #38bdf8;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }

    .setlist-link:hover {
      text-decoration: underline;
    }

    /* Map View Container */
    #mapContainer {
      display: none;
      height: 600px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    /* Leaflet Dark Theme Overrides */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--bg-panel) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-color);
    }

    /* Pagination Controls */
    .pagination-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 35px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .page-btn {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .page-btn:hover:not(:disabled) {
      background-color: #1f2937;
      border-color: #38bdf8;
    }

    .page-btn.active {
      background-color: var(--accent-yellow);
      color: #000;
      border-color: var(--accent-yellow);
      font-weight: 700;
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Modal / Detail View Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .modal-img-container {
      background: #000;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-img-container img {
      max-width: 100%;
      max-height: 48vh;
      object-fit: contain;
      border-radius: 6px;
      cursor: zoom-in;
    }

    /* Thumbnail Gallery in Modal */
    .modal-thumbnails {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      padding: 0 10px;
    }

    .modal-thumb {
      width: 60px;
      height: 45px;
      border-radius: 4px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid var(--border-color);
      opacity: 0.6;
      transition: all 0.2s;
    }

    .modal-thumb:hover, .modal-thumb.active {
      opacity: 1;
      border-color: var(--accent-yellow);
    }

    .modal-body {
      padding: 25px;
    }

    .modal-tour {
      color: var(--accent-yellow);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }

    .modal-grid-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-bottom: 2px;
    }

    .modal-grid-item strong {
      font-size: 0.95rem;
      color: var(--text-main);
    }

    /* Mobile Responsive Overrides */
    @media (max-width: 768px) {
      body { padding: 0 12px 20px 12px; }
      .top-header-container { padding-top: 12px; padding-bottom: 12px; margin-bottom: 15px; }
      header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .title-area h1 { font-size: 1.15rem; flex-wrap: wrap; }
      .stats-bar { flex-wrap: wrap; gap: 6px 10px; font-size: 0.7rem; margin-bottom: 10px; }
      .stats-bar span { display: none; }
      .stats-bar div { background: rgba(255, 255, 255, 0.03); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border-color); }
      .controls { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
      .controls input, .controls select { font-size: 16px !important; padding: 10px 12px; height: 46px; }
      .layout-toggles { justify-content: flex-end; height: 42px; }
      .tickets-container.grid-view { grid-template-columns: 1fr; gap: 15px; }
      .tickets-container.list-view .ticket-card { flex-direction: column; }
      .tickets-container.list-view .card-img-wrapper { width: 100%; height: 160px; }
      #mapContainer { height: 400px; }
      .modal-overlay { padding: 10px; }
      .modal-card { max-height: 95vh; border-radius: 8px; }
      .modal-body { padding: 15px; }
      .modal-grid { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Fixed Top Bar Wrapper -->
  <div class="top-header-container">
    <header>
      <div class="header-left">
        <div class="logo">JJ</div>
        <div class="title-area">
          <h1>Rolf Thalmann´s Ticket Museum <span class="year-badge" id="yearBadge">...</span></h1>
          <p>Historical archive of Joe Jackson´s concert tickets, venues & memorabilia</p>
        </div>
      </div>
    </header>

    <div class="stats-bar">
      <div>LOADED TICKETS: <strong class="stat-val-yellow" id="stat-tickets">0</strong></div> <span>|</span>
      <div>TOURS REPRESENTED: <strong class="stat-val-white" id="stat-tours">0</strong></div> <span>|</span>
      <div>CONTRIBUTORS / DONORS: <strong class="stat-val-white" id="stat-donors">0</strong></div>
    </div>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Search by city, venue, donor, date, tour..." onkeyup="filterData()">
      <select id="tourFilter" onchange="filterData()">
        <option value="">All Tours & Eras</option>
      </select>
      <select id="donorFilter" onchange="filterData()">
        <option value="">All Donors / Sources</option>
      </select>
      <select id="sortFilter" onchange="filterData()">
        <option value="oldest">Date (Oldest First)</option>
        <option value="newest">Date (Newest First)</option>
      </select>
      <select id="pageSizeFilter" onchange="changePageSize()">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="ALL">ALL</option>
      </select>
      <div class="layout-toggles">
        <button class="toggle-btn active" id="btnGrid" onclick="setLayout('grid')">⊞</button>
        <button class="toggle-btn" id="btnList" onclick="setLayout('list')">≡</button>
        <button class="toggle-btn" id="btnMap" onclick="setLayout('map')">🗺️</button>
      </div>
    </div>
  </div>

  <!-- Main Grid / List Container -->
  <div id="ticketsContainer" class="tickets-container grid-view"></div>

  <!-- Interactive Map View Container -->
  <div id="mapContainer"></div>

  <!-- Pagination Controls -->
  <div id="paginationContainer" class="pagination-container"></div>

  <!-- Detail Modal Window -->
  <div class="modal-overlay" id="detailModal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">✕</button>
      
      <div class="modal-img-container">
        <img id="modalImg" src="" alt="Ticket Full View" title="Click to open Zoom / Inspector">
        <div class="modal-thumbnails" id="modalThumbnails"></div>
      </div>

      <div class="modal-body">
        <div class="modal-tour" id="modalTour"></div>
        <div class="modal-title" id="modalInfo"></div>
        
        <div class="modal-grid">
          <div class="modal-grid-item">
            <span>Source / Contributor</span>
            <strong id="modalSource">N/A</strong>
          </div>
          <div class="modal-grid-item">
            <span>Price</span>
            <strong id="modalPrice">N/A</strong>
          </div>
          <div class="modal-grid-item">
            <span>Seat / Row</span>
            <strong id="modalSeat">N/A</strong>
          </div>
          <div class="modal-grid-item" id="modalSupportItem" style="display: none;">
            <span>Supporting Act</span>
            <strong id="modalSupport">N/A</strong>
          </div>
        </div>

        <div id="modalSetlistSection"></div>
      </div>
    </div>
  </div>

  <script>
    let allTickets = [];
    let filteredTickets = [];
    let currentLayout = 'grid';
    let currentPage = 1;
    let pageSize = 50;

    // Leaflet Map & Viewer.js instances
    let mapInstance = null;
    let mapMarkersGroup = null;
    let imageViewerInstance = null;

    // Pre-mapped coordinates dictionary for common cities
    const cityCoordsLookup = {
      "london": [51.5074, -0.1278],
      "paris": [48.8566, 2.3522],
      "new york": [40.7128, -74.0060],
      "berlin": [52.5200, 13.4050],
      "hamburg": [53.5511, 9.9937],
      "munich": [48.1351, 11.5820],
      "münchen": [48.1351, 11.5820],
      "frankfurt": [50.1109, 8.6821],
      "cologne": [50.9375, 6.9603],
      "köln": [50.9375, 6.9603],
      "amsterdam": [52.3676, 4.9041],
      "vienna": [48.2082, 16.3738],
      "wien": [48.2082, 16.3738],
      "prague": [50.0755, 14.4378],
      "praha": [50.0755, 14.4378],
      "brussels": [50.8503, 4.3517],
      "bruxelles": [50.8503, 4.3517],
      "tokyo": [35.6762, 139.6503],
      "sydney": [33.8688, 151.2093],
      "los angeles": [34.0522, -118.2437],
      "chicago": [41.8781, -87.6298],
      "san francisco": [37.7749, -122.4194],
      "ludwigshafen": [49.4811, 8.4353],
      "basel": [47.5596, 7.5886],
      "zurich": [47.3769, 8.5417],
      "zürich": [47.3769, 8.5417],
      "roma": [41.9028, 12.4964],
      "rome": [41.9028, 12.4964],
      "milano": [45.4642, 9.1900],
      "milan": [45.4642, 9.1900]
    };

    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse('joe_jackson_tickets_master_with_setlists.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allTickets = results.data;
          updateStats();
          populateFilters();
          filterData();
        },
        error: function(err) {
          document.getElementById('ticketsContainer').innerHTML = '<p style="color:red">Failed to load CSV file. Ensure it is in the same directory.</p>';
        }
      });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    function updateStats() {
      document.getElementById('stat-tickets').textContent = allTickets.length;
      
      const uniqueTours = new Set(allTickets.map(t => t.TURNE).filter(Boolean));
      document.getElementById('stat-tours').textContent = uniqueTours.size;

      const uniqueDonors = new Set(allTickets.map(t => t.ZDROJ_POSKYTNUL).filter(Boolean));
      document.getElementById('stat-donors').textContent = uniqueDonors.size;

      // Dynamic calculation of year range
      const years = [];
      allTickets.forEach(t => {
        const textToSearch = `${t.DATUM || ''} ${t.INFO_TEXT || ''}`;
        const matches = textToSearch.match(/\b(19\d\d|20\d\d)\b/g);
        if (matches) {
          matches.forEach(y => years.push(parseInt(y, 10)));
        }
      });

      if (years.length > 0) {
        const minYear = Math.min(...years);
        const maxYear = Math.max(...years);
        const badge = document.getElementById('yearBadge');
        if (badge) {
          badge.textContent = minYear === maxYear ? `${minYear}` : `${minYear}-${maxYear}`;
        }
      }
    }

    function populateFilters() {
      const tourSelect = document.getElementById('tourFilter');
      const tours = [...new Set(allTickets.map(t => t.TURNE).filter(Boolean))].sort();
      tours.forEach(tour => {
        const opt = document.createElement('option');
        opt.value = tour;
        opt.textContent = tour;
        tourSelect.appendChild(opt);
      });

      const donorSelect = document.getElementById('donorFilter');
      const donors = [...new Set(allTickets.map(t => t.ZDROJ_POSKYTNUL).filter(Boolean))].sort();
      donors.forEach(donor => {
        const opt = document.createElement('option');
        opt.value = donor;
        opt.textContent = donor;
        donorSelect.appendChild(opt);
      });
    }

    function setLayout(layout) {
      currentLayout = layout;
      const container = document.getElementById('ticketsContainer');
      const mapCont = document.getElementById('mapContainer');
      const paginationCont = document.getElementById('paginationContainer');

      const btnGrid = document.getElementById('btnGrid');
      const btnList = document.getElementById('btnList');
      const btnMap = document.getElementById('btnMap');

      btnGrid.classList.remove('active');
      btnList.classList.remove('active');
      btnMap.classList.remove('active');

      if (layout === 'map') {
        container.style.display = 'none';
        paginationCont.style.display = 'none';
        mapCont.style.display = 'block';
        btnMap.classList.add('active');

        initOrUpdateMap();
      } else {
        mapCont.style.display = 'none';
        container.style.display = 'grid';
        paginationCont.style.display = 'flex';

        if (layout === 'grid') {
          container.className = 'tickets-container grid-view';
          btnGrid.classList.add('active');
        } else {
          container.className = 'tickets-container list-view';
          btnList.classList.add('active');
        }
        renderPaginated();
      }
    }

    function changePageSize() {
      const val = document.getElementById('pageSizeFilter').value;
      pageSize = val === 'ALL' ? 'ALL' : parseInt(val);
      currentPage = 1;
      renderPaginated();
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const tour = document.getElementById('tourFilter').value;
      const donor = document.getElementById('donorFilter').value;
      const sort = document.getElementById('sortFilter').value;

      filteredTickets = allTickets.filter(t => {
        const qMatch = !query || 
          (t.INFO_TEXT || '').toLowerCase().includes(query) ||
          (t.ZDROJ_POSKYTNUL || '').toLowerCase().includes(query) ||
          (t.MESTO || '').toLowerCase().includes(query) ||
          (t.SETLIST || '').toLowerCase().includes(query);
          
        const tMatch = !tour || t.TURNE === tour;
        const dMatch = !donor || t.ZDROJ_POSKYTNUL === donor;

        return qMatch && tMatch && dMatch;
      });

      if (sort === 'newest') {
        filteredTickets.reverse();
      }

      currentPage = 1;

      if (currentLayout === 'map') {
        initOrUpdateMap();
      } else {
        renderPaginated();
      }
    }

    function renderPaginated() {
      let pageData = [];
      if (pageSize === 'ALL') {
        pageData = filteredTickets;
      } else {
        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        pageData = filteredTickets.slice(start, end);
      }

      renderTickets(pageData);
      renderPaginationControls();
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticketsContainer');
      container.innerHTML = '';

      if (tickets.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No tickets found matching your criteria.</p>';
        return;
      }

      tickets.forEach((t, index) => {
        const card = document.createElement('div');
        card.className = 'ticket-card';
        card.onclick = (e) => {
          if (e.target.classList.contains('setlist-toggle-btn') || e.target.classList.contains('setlist-link')) {
            return;
          }
          openModal(t);
        };

        const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
        const firstImgFile = skenFiles[0] || '';
        const imgSrc = firstImgFile ? `./scans/${firstImgFile}` : '';

        // Setlist
        let setlistSection = '';
        const setlistStr = t.SETLIST || '';
        const songCount = parseInt(t.POCET_SKLADEB) || 0;
        
        if (setlistStr && setlistStr !== 'není k dispozici' && songCount > 0) {
          const songs = setlistStr.split(',').map(s => s.trim());
          const listItems = songs.map(s => `<li>${s}</li>`).join('');
          const setlistUrl = (t.SETLIST_URL && t.SETLIST_URL !== 'není k dispozici') ? `<a href="${t.SETLIST_URL}" target="_blank" class="setlist-link">View on Setlist.fm ↗</a>` : '';

          setlistSection = `
            <button class="setlist-toggle-btn" onclick="event.stopPropagation(); toggleSetlist('${index}')">🎵 View Setlist (${songCount})</button>
            <div class="setlist-content" id="setlist-${index}">
              <ol>${listItems}</ol>
              ${setlistUrl}
            </div>
          `;
        } else {
          setlistSection = `
            <button class="setlist-toggle-btn" style="opacity: 0.5; cursor: default;" onclick="event.stopPropagation();">No setlist available</button>
          `;
        }

        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imgSrc ? `<img src="${imgSrc}" alt="Ticket Scan" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMwMDAiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZmlsbD0iIzMzMyIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkltYWdlIE5vdCBGb3VuZDwvdGV4dD48L3N2Zz4='">` : ''}
          </div>
          <div class="card-content">
            <div class="tour-name">${t.TURNE || 'UNKNOWN TOUR'}</div>
            <div class="info-text">${t.INFO_TEXT || ''}</div>
            
            <div class="source-row">
              <span>Source:</span>
              <span class="source-val">${t.ZDROJ_POSKYTNUL || 'Unknown'}</span>
            </div>
            
            ${setlistSection}
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    /* Map Initialization & Marker Updates */
    function initOrUpdateMap() {
      if (!mapInstance) {
        mapInstance = L.map('mapContainer').setView([50.0, 10.0], 4);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(mapInstance);

        mapMarkersGroup = L.layerGroup().addTo(mapInstance);
      }

      mapMarkersGroup.clearLayers();

      filteredTickets.forEach((t) => {
        const mestoStr = (t.MESTO || t.INFO_TEXT || '').toLowerCase();
        let coords = null;

        for (let cityKey in cityCoordsLookup) {
          if (mestoStr.includes(cityKey)) {
            coords = cityCoordsLookup[cityKey];
            break;
          }
        }

        if (coords) {
          const marker = L.marker(coords);
          const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
          const firstImgFile = skenFiles[0] || '';
          const imgSrc = firstImgFile ? `./scans/${firstImgFile}` : '';

          const popupContent = `
            <div style="font-family: var(--font-family); width: 200px;">
              <strong style="color: var(--accent-yellow); font-size: 0.8rem;">${t.TURNE || ''}</strong>
              <div style="font-weight: 600; font-size: 0.85rem; margin: 4px 0;">${t.INFO_TEXT || ''}</div>
              ${imgSrc ? `<img src="${imgSrc}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 4px; margin-top: 6px;">` : ''}
            </div>
          `;

          marker.bindPopup(popupContent);
          mapMarkersGroup.addLayer(marker);
        }
      });
    }

    function renderPaginationControls() {
      const container = document.getElementById('paginationContainer');
      container.innerHTML = '';

      if (pageSize === 'ALL' || filteredTickets.length <= pageSize) {
        return;
      }

      const totalPages = Math.ceil(filteredTickets.length / pageSize);

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '◄ Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderPaginated();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      container.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 3 && i !== 1 && i !== totalPages) {
          if (i === 2 || i === totalPages - 1) {
            const dots = document.createElement('span');
            dots.textContent = '...';
            dots.style.color = 'var(--text-muted)';
            dots.style.padding = '0 4px';
            container.appendChild(dots);
          }
          continue;
        }

        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
        pageBtn.textContent = i;
        pageBtn.onclick = () => {
          currentPage = i;
          renderPaginated();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        container.appendChild(pageBtn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = 'Next ►';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => {
        if (currentPage < totalPages) {
          currentPage++;
          renderPaginated();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      container.appendChild(nextBtn);
    }

    function toggleSetlist(id) {
      const el = document.getElementById(`setlist-${id}`);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function openModal(t) {
      const skenFiles = (t.SOUBOR_SKEN || '').split(',').map(s => s.trim()).filter(Boolean);
      const modalImg = document.getElementById('modalImg');
      const thumbContainer = document.getElementById('modalThumbnails');
      
      thumbContainer.innerHTML = '';

      if (skenFiles.length > 0) {
        modalImg.src = `./scans/${skenFiles[0]}`;

        // Render thumbnails gallery if multiple scans exist
        if (skenFiles.length > 1) {
          skenFiles.forEach((file, idx) => {
            const thumb = document.createElement('img');
            thumb.className = `modal-thumb ${idx === 0 ? 'active' : ''}`;
            thumb.src = `./scans/${file}`;
            thumb.onclick = () => {
              modalImg.src = `./scans/${file}`;
              document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');
              
              if (imageViewerInstance) {
                imageViewerInstance.destroy();
                imageViewerInstance = new Viewer(modalImg, { toolbar: true, navbar: false });
              }
            };
            thumbContainer.appendChild(thumb);
          });
        }
      } else {
        modalImg.src = '';
      }

      // Initialize Viewer.js Zoom inspector
      if (imageViewerInstance) {
        imageViewerInstance.destroy();
      }
      imageViewerInstance = new Viewer(modalImg, { toolbar: true, navbar: false });

      document.getElementById('modalTour').textContent = t.TURNE || 'UNKNOWN TOUR';
      document.getElementById('modalInfo').textContent = t.INFO_TEXT || '';
      document.getElementById('modalSource').textContent = t.ZDROJ_POSKYTNUL || 'N/A';
      
      const price = (t.CENA && t.CENA !== 'není k dispozici') ? `${t.CENA} ${t.MENA !== 'není k dispozici' ? t.MENA : ''}` : 'N/A';
      document.getElementById('modalPrice').textContent = price;

      const seat = (t.SEKTOR_RADA_SEDADLO && t.SEKTOR_RADA_SEDADLO !== 'není k dispozici') ? t.SEKTOR_RADA_SEDADLO : 'N/A';
      document.getElementById('modalSeat').textContent = seat;

      const supportItem = document.getElementById('modalSupportItem');
      const supportVal = t.SUPPORTING_ACT ? t.SUPPORTING_ACT.trim() : '';
      if (supportVal && supportVal.toLowerCase() !== 'není k dispozici') {
        document.getElementById('modalSupport').textContent = supportVal;
        supportItem.style.display = 'block';
      } else {
        supportItem.style.display = 'none';
      }

      // Setlist for Modal
      const modalSetlistSec = document.getElementById('modalSetlistSection');
      const setlistStr = t.SETLIST || '';
      const songCount = parseInt(t.POCET_SKLADEB) || 0;

      if (setlistStr && setlistStr !== 'není k dispozici' && songCount > 0) {
        const songs = setlistStr.split(',').map(s => s.trim());
        const listItems = songs.map(s => `<li>${s}</li>`).join('');
        const setlistUrl = (t.SETLIST_URL && t.SETLIST_URL !== 'není k dispozici') ? `<a href="${t.SETLIST_URL}" target="_blank" class="setlist-link">View on Setlist.fm ↗</a>` : '';

        modalSetlistSec.innerHTML = `
          <h4 style="color: var(--accent-yellow); margin-bottom: 10px;">🎵 Full Setlist (${songCount} songs)</h4>
          <ol style="padding-left: 20px; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6;">${listItems}</ol>
          ${setlistUrl}
        `;
      } else {
        modalSetlistSec.innerHTML = `<p style="color: var(--text-muted); font-style: italic;">No setlist available for this concert.</p>`;
      }

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
      if (imageViewerInstance) {
        imageViewerInstance.destroy();
        imageViewerInstance = null;
      }
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detailModal') {
        closeModal();
      }
    }
  </script>
</body>
</html>
