<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Jackson Ticket Museum</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar / Navigation */
    aside {
      width: 280px;
      background-color: #020617;
      border-right: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    aside h1 {
      font-size: 1.25rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.9rem;
    }

    .filter-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .filter-group select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: #fff;
    }

    /* Main Content Area */
    main {
      flex: 1;
      padding: 30px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
    }

    .counter {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .ticket-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Ticket Card - Two Column Original Layout */
    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .ticket-card:hover {
      border-color: var(--accent);
    }

    .ticket-scan {
      width: 320px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      flex-shrink: 0;
    }

    .ticket-scan img {
      max-width: 100%;
      max-height: 220px;
      object-fit: contain;
    }

    .ticket-info {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .tour-tag {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .ticket-id {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .info-main {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: rgba(0,0,0,0.2);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .meta-item span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* Setlist Box Integration */
    .setlist-box {
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .setlist-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .setlist-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent);
    }

    .setlist-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
    }

    .setlist-link:hover { text-decoration: underline; }

    .song-preview {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .more-songs {
      display: none;
      margin-top: 6px;
    }

    .btn-toggle {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 0 0 0;
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <aside>
    <h1>Ticket Museum</h1>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search archive..." onkeyup="filterData()">
    </div>

    <div class="filter-group">
      <label>Tour</label>
      <select id="tourFilter" onchange="filterData()">
        <option value="">All Tours</option>
      </select>
    </div>
  </aside>

  <main>
    <div class="header-bar">
      <h2>Joe Jackson Concert Archive</h2>
      <div id="counter" class="counter">Loading tickets...</div>
    </div>

    <div id="ticketList" class="ticket-list"></div>
  </main>

  <script>
    let allTickets = [];

    window.addEventListener('DOMContentLoaded', () => {
      Papa.parse('joe_jackson_tickets_master_with_setlists.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          allTickets = results.data;
          populateTourFilter();
          filterData();
        }
      });
    });

    function populateTourFilter() {
      const tourSelect = document.getElementById('tourFilter');
      const tours = [...new Set(allTickets.map(t => t.TURNE).filter(Boolean))].sort();
      tours.forEach(tour => {
        const opt = document.createElement('option');
        opt.value = tour;
        opt.textContent = tour;
        tourSelect.appendChild(opt);
      });
    }

    function renderTickets(tickets) {
      const container = document.getElementById('ticketList');
      const counter = document.getElementById('counter');
      container.innerHTML = '';
      counter.textContent = `Showing ${tickets.length} of ${allTickets.length} tickets`;

      if (tickets.length === 0) {
        container.innerHTML = '<div class="empty-state">No tickets matched your search.</div>';
        return;
      }

      tickets.forEach(t => {
        const card = document.createElement('div');
        card.className = 'ticket-card';

        const skenFiles = (t.SOUBOR_SKEN || '').split(',');
        const firstImg = skenFiles[0] ? skenFiles[0].trim() : '';

        const price = (t.CENA && t.CENA !== 'není k dispozici') ? `${t.CENA} ${t.MENA !== 'není k dispozici' ? t.MENA : ''}` : 'N/A';
        const seat = (t.SEKTOR_RADA_SEDADLO && t.SEKTOR_RADA_SEDADLO !== 'není k dispozici') ? t.SEKTOR_RADA_SEDADLO : 'N/A';
        const support = (t.SUPPORTING_ACT && t.SUPPORTING_ACT !== 'není k dispozici') ? t.SUPPORTING_ACT : 'N/A';

        // Setlist rendering
        let setlistSection = '';
        const setlistStr = t.SETLIST || '';
        const songCount = parseInt(t.POCET_SKLADEB) || 0;
        const setlistUrl = (t.SETLIST_URL && t.SETLIST_URL !== 'není k dispozici') ? t.SETLIST_URL : null;

        if (setlistStr && setlistStr !== 'není k dispozici' && songCount > 0) {
          const songs = setlistStr.split(',').map(s => s.trim());
          const firstFive = songs.slice(0, 5).join(', ');
          const restSongs = songs.slice(5).join(', ');

          const urlLink = setlistUrl ? `<a href="${setlistUrl}" target="_blank" class="setlist-link">Setlist.fm ↗</a>` : '';

          setlistSection = `
            <div class="setlist-box">
              <div class="setlist-head">
                <span class="setlist-title">🎵 Setlist (${songCount} songs)</span>
                ${urlLink}
              </div>
              <div class="song-preview">
                1. ${firstFive}${restSongs ? '...' : ''}
                ${restSongs ? `
                  <div class="more-songs" id="more-${t.ID_LISTKU}">${restSongs}</div>
                  <button class="btn-toggle" onclick="toggleSongs('${t.ID_LISTKU}', this)">▼ Show all ${songCount} songs</button>
                ` : ''}
              </div>
            </div>
          `;
        } else {
          setlistSection = `
            <div class="setlist-box">
              <span class="song-preview" style="font-style: italic;">🎵 Setlist not available</span>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="ticket-scan">
            ${firstImg ? `<img src="${firstImg}" alt="Ticket ${t.ID_LISTKU}" onerror="this.src='https://via.placeholder.com/300x150?text=Scan+missing'">` : '<span>No Scan</span>'}
          </div>
          <div class="ticket-info">
            <div>
              <div class="ticket-header">
                <span class="tour-tag">${t.TURNE || 'Concert'}</span>
                <span class="ticket-id">${t.ID_LISTKU || ''}</span>
              </div>
              <div class="info-main">${t.INFO_TEXT || ''}</div>
              <div class="metadata-grid">
                <div class="meta-item"><span>Price</span>${price}</div>
                <div class="meta-item"><span>Seat / Row</span>${seat}</div>
                <div class="meta-item"><span>Supporting Act</span>${support}</div>
              </div>
            </div>
            ${setlistSection}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function toggleSongs(id, btn) {
      const el = document.getElementById(`more-${id}`);
      if (el.style.display === 'block') {
        el.style.display = 'none';
        btn.innerText = '▼ Show all songs';
      } else {
        el.style.display = 'block';
        btn.innerText = '▲ Hide remaining songs';
      }
    }

    function filterData() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const selectedTour = document.getElementById('tourFilter').value;

      const filtered = allTickets.filter(t => {
        const matchesQuery = !query || 
          (t.INFO_TEXT || '').toLowerCase().includes(query) ||
          (t.SETLIST || '').toLowerCase().includes(query) ||
          (t.ID_LISTKU || '').toLowerCase().includes(query);
        
        const matchesTour = !selectedTour || t.TURNE === selectedTour;

        return matchesQuery && matchesTour;
      });

      renderTickets(filtered);
    }
  </script>
</body>
</html>
