<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joe Jackson Museum - Contribute Memorabilia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎫</text></svg>">
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .form-container {
      width: 100%;
      max-width: 750px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .form-intro {
      margin-bottom: 25px;
      line-height: 1.6;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .form-intro strong { color: var(--accent-yellow); }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full-width { grid-column: 1 / -1; }

    label { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    label span { color: var(--accent-orange); }

    input[type="text"], input[type="date"], input[type="email"], select, textarea {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }

    input[type="file"] {
      background-color: var(--bg-card);
      border: 1px dashed var(--accent-blue);
      color: var(--text-muted);
      padding: 15px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-submit {
      background-color: var(--accent-yellow);
      color: #000;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background-color: #fde047; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: wait; transform: none; }

    #statusMessage {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: none;
      text-align: center;
      line-height: 1.5;
    }
    #statusMessage.success {
      background: rgba(74, 222, 128, 0.15);
      border: 1px solid #4ade80;
      color: #4ade80;
    }
    #statusMessage.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    @media (max-width: 600px) {
      body { padding: 15px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header style="max-width: 750px;">
    <div class="header-left">
      <div class="logo">JJ</div>
      <div class="title-area">
        <h1>Contribute to Archive</h1>
        <p>Share your Joe Jackson concert tickets, passes, or posters</p>
      </div>
    </div>
    <a href="index_short.html" class="btn-contribute">◄ Back to Museum</a>
  </header>

  <div class="form-container">
    <p class="form-intro">
      Do you possess a Joe Jackson concert ticket, pass, poster, or program scan not yet featured in our museum? 
      <strong>Help us grow the archive!</strong> Please submit <strong>one concert item per form</strong>.
    </p>

    <form id="contribForm" action="https://formsubmit.co/marekkraus@gmail.com" method="POST" enctype="multipart/form-data" class="form-grid">
      <input type="hidden" name="_subject" value="JJMM - addition">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">

      <div class="form-group">
        <label for="category">Category <span>*</span></label>
        <select id="category" name="Category" required>
          <option value="Tickets">Ticket</option>
          <option value="Passes">Pass / Backstage</option>
          <option value="Posters">Poster / Flyer</option>
          <option value="Programs">Tour Program</option>
          <option value="T-shirts">Merchandise / T-shirt</option>
          <option value="Memorabilia">Other Memorabilia</option>
        </select>
      </div>

      <div class="form-group">
        <label for="date">Concert Date <span>*</span></label>
        <input type="date" id="date" name="Concert Date" required>
      </div>

      <div class="form-group">
        <label for="city">City <span>*</span></label>
        <input type="text" id="city" name="City" placeholder="e.g. London, New York" required>
      </div>

      <div class="form-group">
        <label for="country">Country</label>
        <input type="text" id="country" name="Country" placeholder="e.g. UK, USA, Germany">
      </div>

      <div class="form-group full-width">
        <label for="venue">Venue / Club / Hall</label>
        <input type="text" id="venue" name="Venue" placeholder="e.g. Royal Albert Hall, The Bottom Line">
      </div>

      <div class="form-group full-width">
        <label for="supporting_act">Supporting Act / Special Guest</label>
        <input type="text" id="supporting_act" name="Supporting Act" placeholder="e.g. The Members, Lincoln Durham">
      </div>

      <div class="form-group">
        <label for="contributor">Your Name / Credit <span>*</span></label>
        <input type="text" id="contributor" name="Contributor Credit" placeholder="How you want to be listed" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email (Private)</label>
        <input type="email" id="email" name="email" placeholder="For verification only (optional)">
      </div>

      <div class="form-group full-width">
        <label for="scan_file">Upload Image Scan / Photo <span>*</span></label>
        <input type="file" id="scan_file" name="Attachment" accept="image/*" required>
      </div>

      <div class="form-group full-width">
        <label for="notes">Additional Information / Notes</label>
        <textarea id="notes" name="Notes" rows="3" placeholder="Setlist details, story behind the ticket, or personal memories..."></textarea>
      </div>

      <div class="form-group full-width">
        <button type="submit" id="submitBtn" class="btn-submit">🚀 Submit Memorabilia to Archive</button>
      </div>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    document.getElementById('contribForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = this;
      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ Sending memorabilia...';
      statusMsg.style.display = 'none';

      try {
        const formData = new FormData(form);

        const response = await fetch(form.action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          statusMsg.className = 'success';
          statusMsg.style.display = 'block';
          statusMsg.innerHTML = '🎉 <strong>Thank you!</strong> Your memorabilia contribution has been sent successfully. We will review it shortly.';
          form.reset();
        } else {
          throw new Error(`HTTP ${response.status}`);
        }
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.style.display = 'block';
        statusMsg.innerHTML = '❌ <strong>Submission Error:</strong> Could not send form. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚀 Submit Memorabilia to Archive';
      }
    });
  </script>
</body>
</html>
